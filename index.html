<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 26</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: a single centred column. Act 1 is a typed paper dossier; Act 2 is the
   machine's instrument panel. One deliberate look in both host themes. */
:root {
  color-scheme: dark;
  --desk: #1b2230;        /* page ground: blue-steel desk */
  --paper: #e9ecef;       /* dossier sheet, cool not cream */
  --ink: #1d2330;         /* typed text */
  --stamp: #b3261e;       /* CLASSIFIED red */
  --panel: #0f141d;       /* machine console */
  --panel-line: #2b3546;
  --amber: #f2a93b;       /* readouts */
  --amber-dim: #8a6427;
  --text: #d7dde6;
  --muted: #8b96a8;
  --ok: #6fcf97;
  --bad: #ef6b5b;
  --f-display: "Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}
.wrap { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

/* ---------- Act 1: dossier ---------- */
.dossier {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 15px;
  padding: 40px clamp(20px, 6vw, 48px) 36px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  transform: rotate(-.4deg);
}
.dossier .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.dossier h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 9vw, 64px);
  line-height: .95; letter-spacing: .02em; margin: 22px 0 4px; text-wrap: balance; }
.dossier .sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 24px; }
.dossier p { margin: 0 0 14px; max-width: 62ch; }
.dossier .warn { border-left: 3px solid var(--stamp); padding-left: 12px; }
.stamp {
  position: absolute; top: 74px; right: clamp(12px, 5vw, 40px);
  font-family: var(--f-display); font-weight: 900; font-size: 22px; letter-spacing: .12em;
  color: var(--stamp); border: 3px solid var(--stamp); padding: 2px 10px;
  transform: rotate(8deg); opacity: .85; mix-blend-mode: multiply;
}
.redact { background: var(--ink); color: var(--ink); padding: 0 4px; user-select: none; }
.activate {
  margin-top: 18px; display: inline-flex; align-items: center; gap: 12px;
  background: var(--stamp); color: var(--paper); border: 0; padding: 14px 22px;
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .1em; text-transform: uppercase;
  box-shadow: 0 4px 0 #6d140f;
}
.activate:active { transform: translateY(3px); box-shadow: 0 1px 0 #6d140f; }
.activate .led { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); }

/* ---------- Act 2: console ---------- */
.console { --pad-x: clamp(16px, 5vw, 32px); --pad-y: clamp(18px, 5vw, 32px);
  background: var(--panel); border: 1px solid var(--panel-line); padding: var(--pad-y) var(--pad-x); display: grid; gap: 24px; min-width: 0; }
.console, .card { grid-template-columns: minmax(0, 1fr); }
.console > *, .card > * { min-width: 0; }
.readout { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 20px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.readout strong { color: var(--amber); font-weight: 600; font-variant-numeric: tabular-nums; }
.status-error { color: var(--bad); }
.timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 6px; }
.slot { border: 1px solid var(--panel-line); padding: 8px 4px; text-align: center; font-family: var(--f-mono);
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slot.done { border-color: var(--amber-dim); color: var(--amber); }
.slot.current { border-color: var(--amber); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.card { display: grid; gap: 14px; }
.card .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.card h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 6vw, 38px); line-height: 1.05;
  letter-spacing: .03em; margin: 0; color: var(--text); text-wrap: balance; }
.riddle { white-space: pre-line; font-size: 17px; max-width: 60ch; margin: 0; }
.sample { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--desk); background: var(--muted); padding: 1px 6px; justify-self: start; }
form.answer { display: flex; flex-wrap: wrap; gap: 10px; }
form.answer input { flex: 1 1 220px; min-width: 0; background: #070a10; color: var(--amber); border: 1px solid var(--panel-line);
  padding: 12px 14px; font-family: var(--f-mono); font-size: 16px; letter-spacing: .05em; }
form.answer input::placeholder { color: var(--amber-dim); }
.btn { background: var(--amber); color: var(--panel); border: 0; padding: 12px 18px; font-family: var(--f-mono);
  font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--panel-line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.feedback { font-family: var(--f-mono); font-size: 14px; min-height: 1.5em; margin: 0; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.hint { font-family: var(--f-mono); font-size: 14px; color: var(--muted); border-left: 2px solid var(--amber-dim); padding-left: 12px; margin: 0; }
.log { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border-top: 1px dashed var(--panel-line); padding-top: 14px;
  display: grid; gap: 4px; max-height: 9.5em; overflow-y: auto; }
.reveal { text-align: left; display: grid; gap: 16px; }
.reveal p { margin: 0; font-size: 17px; max-width: 60ch; white-space: pre-line; }
.foot { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: center; letter-spacing: .08em; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font: inherit; }

/* face-swap puzzle */
.viewport { overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--panel-line);
  scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent; }
.stage { position: relative; overflow: hidden; width: 100%; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; touch-action: pan-x pan-y; }
.stage > img { display: block; width: 100%; height: auto; -webkit-touch-callout: none; }
.swipe { display: none; margin: -14px 0 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.dock { position: sticky; bottom: 0; z-index: 5; margin-inline: calc(-1 * var(--pad-x));
  background: var(--panel); border-top: 1px solid var(--panel-line);
  padding: 12px var(--pad-x) calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.dock-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dock-head strong { color: var(--amber); font-variant-numeric: tabular-nums; }
.dock-head .feedback { font-size: 13px; letter-spacing: 0; text-transform: none; min-height: 1.4em; }
.fslot { position: absolute; border-radius: 50%; border: 2px dashed var(--amber); background: rgba(242,169,59,.08);
  padding: 0; overflow: hidden; }
.fslot.hover { background: rgba(242,169,59,.35); border-style: solid; }
.fslot.filled { border: 0; background: none; cursor: default; overflow: visible; outline: none; }
.fslot.filled img { transform: scale(1.14); }   /* covers the blurred patch left where the face was cut out */
.fslot img { width: 100%; height: 100%; display: block; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.piece { background: none; border: 2px solid transparent; padding: 2px; border-radius: 50%; touch-action: none; line-height: 0;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.piece img { height: 56px; width: auto; display: block; pointer-events: none; }
.piece.selected { border-color: var(--amber); box-shadow: 0 0 12px rgba(242,169,59,.6); }
.piece.lifted { opacity: .25; }
/* phone: the photo is shown larger than the screen and scrolls sideways, so small faces stay tappable */
@media (max-width: 700px) {
  .stage { width: 800px; max-width: none; }
  .swipe { display: block; }
}
/* the dragged face is centred on the finger, matching where the drop is detected */
.drag-ghost { position: fixed; height: 72px; width: auto; transform: translate(-50%, -50%); pointer-events: none; z-index: 50;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.6)); }

/* chronological-order puzzle */
.order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.opick { position: relative; aspect-ratio: 3 / 4; max-width: 100%; padding: 0; overflow: hidden; background: #070a10;
  border: 2px solid var(--panel-line); -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
.opick img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.opick.picked { border-color: var(--amber); }
.opick.picked img { opacity: .55; }
.opick:disabled { cursor: default; }
.opick:disabled img { opacity: 1; }
.badge { position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--amber); color: var(--panel); font-family: var(--f-mono); font-weight: 600; font-size: 17px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* New Year's kiss puzzle */
.nye { position: relative; width: 100%; max-width: 440px; margin-inline: auto; aspect-ratio: 3 / 4; overflow: hidden;
  border: 1px solid var(--panel-line); background: #060a1a; user-select: none; -webkit-user-select: none; }
.nye-bg, .nye-fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.nye-fx { pointer-events: none; z-index: 3; }
#ball { transition: transform .25s ease-out; }
.nye-clock { position: absolute; top: 10px; right: 10px; z-index: 2; font-family: var(--f-mono); font-weight: 600; font-size: 15px;
  color: var(--amber); background: rgba(6,10,26,.75); border: 1px solid var(--amber-dim); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.who { position: absolute; bottom: -2%; width: 34%; padding: 0; border: 0; background: none; z-index: 2; cursor: grab;
  touch-action: none; transition: left .25s ease-out; -webkit-tap-highlight-color: transparent; transform-origin: 50% 100%; }
.who.held { cursor: grabbing; transition: none; }
.who svg { display: block; width: 100%; height: auto; transition: transform .5s cubic-bezier(.3,1.4,.5,1); transform-origin: 50% 100%; }
.who.girl { z-index: 2; }
.who:not(.arrived) { animation: bob 1.6s ease-in-out infinite; }
.who.guy:not(.arrived) { animation-delay: -.8s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.who .blush, .who .eyes-closed { opacity: 0; transition: opacity .4s; }
.nye.kissing .who .blush, .nye.kissing .girl .eyes-closed { opacity: .8; }
.nye.kissing .girl .eyes-open { opacity: 0; }
.who .pose { display: block; }
.who .side, .who.arrived .front { display: none; }
.who.arrived .side { display: block; }
.who .side .blush { opacity: .55; }
/* upright side profiles already meet lip to lip in the middle; no extra lean */
.nye.kissing .guy .side svg, .nye.kissing .girl .side svg { transform: none; }
.heart { position: absolute; left: 50%; top: 30%; width: 30px; margin-left: -15px; z-index: 4; opacity: 0; transform: scale(.4); pointer-events: none; }
.nye.kissing .heart { animation: heart 2.2s ease-out .35s forwards; }
@keyframes heart { 0% { opacity: 0; transform: translateY(0) scale(.4); } 20% { opacity: 1; transform: translateY(-6px) scale(1.15); }
  100% { opacity: 0; transform: translateY(-70px) scale(1); } }
.hny { position: absolute; left: 0; right: 0; top: 16%; z-index: 4; text-align: center; font-family: var(--f-display); font-weight: 900;
  font-size: clamp(30px, 10vw, 46px); letter-spacing: .04em; color: #ffd34d; text-shadow: 0 0 18px rgba(255,211,77,.6);
  opacity: 0; transform: scale(.8); transition: opacity .5s .3s, transform .5s .3s; pointer-events: none; }
.nye.midnight .hny { opacity: 1; transform: none; transition-delay: 0s; animation: hnyPulse .6s ease-in-out infinite alternate; }
.nye.kissing .hny, .nye.failed .hny { animation: none; }
.nye.failed .hny { opacity: 0; }
@keyframes hnyPulse { to { transform: scale(1.06); } }
.nye.midnight #yr { fill: #ffd34d; }
.count { position: absolute; left: 0; right: 0; top: 22%; z-index: 4; text-align: center; pointer-events: none;
  font-family: var(--f-display); font-weight: 900; font-size: clamp(80px, 30vw, 130px); line-height: 1; color: #fff;
  text-shadow: 0 0 24px rgba(69,214,255,.7); }
.count.pop { animation: pop .9s ease-out; }
@keyframes pop { 0% { transform: scale(1.5); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: .15; } }
.nye-overlay { position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; justify-items: center; gap: 14px;
  padding: 24px; text-align: center; background: rgba(6,10,26,.55); }
.nye-overlay p { margin: 0; max-width: 28ch; color: #fff; font-size: 17px; text-wrap: balance; }
#nyeFail { background: rgba(6,10,26,.8); }
.nye-photo { position: absolute; inset: 0; margin: 0; z-index: 5; background: #060a1a; opacity: 0; transition: opacity 1.2s ease; }
.nye.revealed .nye-photo { opacity: 1; }
.nye-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nye-photo figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 12px;
  background: linear-gradient(transparent, rgba(6,10,26,.9)); color: #fff; font-family: var(--f-mono); font-size: 13px; }
.nye-photo figcaption span { display: block; color: var(--amber); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .who:not(.arrived), .nye.midnight .hny, .count.pop { animation: none; } .nye.kissing .heart { animation: none; opacity: 1; } }

/* date + map puzzle */
.where-photo { width: 100%; max-height: 380px; object-fit: cover; object-position: 50% 30%; display: block; border: 1px solid var(--panel-line); }
.where-block { display: grid; gap: 10px; }
.where-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.where-head .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.chip { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--panel-line); padding: 3px 9px; }
.chip.set { color: var(--text); border-color: var(--amber-dim); }
.cal { border: 1px solid var(--panel-line); padding: 10px; background: #070a10; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-family: var(--f-mono); font-size: 15px; }
.cal-nav { background: none; border: 1px solid var(--panel-line); color: var(--text); width: 44px; font-size: 22px; line-height: 1; }
.cal-nav:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow span { text-align: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 4px 0; }
.day { min-height: 40px; background: transparent; border: 1px solid transparent; color: var(--text); font-family: var(--f-mono);
  font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.day:hover:not(:disabled) { border-color: var(--panel-line); }
.day.on { background: var(--amber); color: var(--panel); font-weight: 600; }
.day:disabled { cursor: default; }
.map { border: 1px solid var(--panel-line); background: #121a28; line-height: 0; }
.map svg { width: 100%; height: auto; display: block; cursor: crosshair; touch-action: manipulation; }
.map .land { fill: #1a2333; }
.map .water { fill: #2b4c70; }
.map .zone { fill: transparent; stroke: transparent; stroke-width: 4; transition: fill .6s, stroke .6s; }
.map .zone.found { fill: rgba(242,169,59,.35); stroke: var(--amber); }
.map .scale path { stroke: var(--muted); stroke-width: 5; fill: none; }
.map text { fill: var(--muted); font-family: var(--f-mono); font-size: 38px; }
.map .compass path { fill: var(--muted); }
#pin path { fill: var(--amber); stroke: #070a10; stroke-width: 3; }
#pin circle { fill: #070a10; }
.map-note { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* wok seasoning puzzle */
.wok-stage { position: relative; width: 100%; max-width: 440px; margin-inline: auto; aspect-ratio: 1; border: 1px solid var(--panel-line);
  background: #14171d; overflow: hidden; }
.wok-stage canvas { display: block; touch-action: none; cursor: grab; }
.wok-stage canvas:active { cursor: grabbing; }
.wok-meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wok-meter strong { color: var(--amber); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.wok-meter .bar { height: 8px; background: #070a10; border: 1px solid var(--panel-line); }
.wok-meter .bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s; }
.wok-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: -12px;
  font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.wok-legend i { width: 10px; height: 10px; border: 1px solid var(--panel-line); margin-left: 4px; }

/* volleyball puzzle */
.vb-board { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto minmax(0, 1fr); align-items: center; gap: 4px 10px;
  background: #070a10; border: 1px solid var(--panel-line); padding: 10px 12px; font-family: var(--f-mono); }
.vb-league { grid-column: 1 / -1; text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.vb-team { font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
.vb-team:first-of-type { text-align: right; }
.vb-board strong { font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: center; }
.vb-dash { color: var(--muted); }
.vb-stage { position: relative; width: 100%; max-width: 440px; margin-inline: auto; aspect-ratio: 4 / 5; border: 1px solid var(--panel-line);
  overflow: hidden; background: #5aa7e6; }
.vb-stage canvas { display: block; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.vb-stage .nye-photo.show { opacity: 1; }
.vb-stage .nye-photo { background: #0f141d; display: grid; align-content: center; }
.vb-stage .nye-photo img { height: auto; object-fit: contain; }
.vb-stage .nye-photo figcaption { position: static; background: none; padding: 12px 14px 0; }

/* spot-the-forgery puzzle */
.spot-thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.spot-thumb { position: relative; padding: 0; aspect-ratio: 3 / 4; overflow: hidden; background: #070a10; border: 2px solid var(--panel-line);
  -webkit-tap-highlight-color: transparent; }
.spot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.spot-thumb span { position: absolute; top: 4px; left: 4px; font-family: var(--f-mono); font-weight: 600; font-size: 12px;
  background: rgba(7,10,16,.8); color: var(--text); padding: 1px 6px; }
.spot-thumb.on { border-color: var(--amber); }
.spot-thumb.fake img { opacity: .35; filter: grayscale(1); }
.spot-thumb.fake::after { content: "FORGED"; position: absolute; inset: auto 0 40% 0; text-align: center; transform: rotate(-12deg);
  font-family: var(--f-display); font-weight: 900; font-size: 15px; letter-spacing: .08em; color: var(--bad); }
.spot-thumb.real { border-color: var(--ok); }
.spot-thumb.real::after { content: "REAL"; position: absolute; inset: auto 0 40% 0; text-align: center; transform: rotate(-12deg);
  font-family: var(--f-display); font-weight: 900; font-size: 17px; letter-spacing: .08em; color: var(--ok); text-shadow: 0 1px 4px #000; }
.spot-view { position: relative; overflow: hidden; aspect-ratio: 3 / 4; border: 1px solid var(--panel-line); background: #070a10;
  touch-action: none; cursor: zoom-in; user-select: none; -webkit-user-select: none; }

/* ================================================================ */
const app = document.getElementById("app");
const KEY = "year-zero-progress";
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9]+/g, " ").trim();
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let state = load() || { phase: "locked", index: 0, log: [] };
const N = HUNT.coordinates.length;

function render() {
  document.body.classList.remove("ending");
  save(state);
  if (state.phase === "locked") return renderLock();
  if (state.phase === "briefing") return renderBriefing();
  if (state.phase === "done") return renderFinale();
  renderConsole();
}

function renderLock() {
  const L = HUNT.lock, digits = [0, 0, 0, 0];
  app.innerHTML = `
    <section class="lock" id="lock">
      <span class="end-eyebrow">Temporal Research Division</span>
      <h1 class="lock-title">${esc(L.title)}</h1>
      <p class="lock-prompt">${esc(L.prompt)}</p>
      <div class="dials" id="dials">${digits.map((d, i) => `
        <div class="dial">
          <button type="button" class="dial-btn" data-i="${i}" data-d="1" aria-label="Digit ${i + 1} up">▲</button>
          <div class="dial-num" id="dial${i}" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" aria-label="Digit ${i + 1}">0</div>
          <button type="button" class="dial-btn" data-i="${i}" data-d="-1" aria-label="Digit ${i + 1} down">▼</button>
        </div>`).join("")}
      </div>
      ${L.hint ? `<p class="lock-hint">${esc(L.hint)}</p>` : ""}
      <button class="btn lock-go" id="unlock" type="button">Unlock</button>
      <p class="feedback" id="lockFb" aria-live="polite"></p>
    </section>`;
  const fb = document.getElementById("lockFb"), lockEl = document.getElementById("lock");
  const set = (i, v) => {
    digits[i] = (v + 10) % 10;
    const el = document.getElementById("dial" + i);
    el.textContent = digits[i]; el.setAttribute("aria-valuenow", digits[i]);
    el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    fb.textContent = ""; fb.className = "feedback";
  };
  document.getElementById("dials").addEventListener("click", e => {
    const b = e.target.closest(".dial-btn"); if (b) set(+b.dataset.i, digits[+b.dataset.i] + +b.dataset.d);
  });
  // swipe a dial up or down; on a keyboard use the arrows or type the digit
  digits.forEach((_, i) => {
    const el = document.getElementById("dial" + i);
    let sy = null;
    el.addEventListener("pointerdown", e => { sy = e.clientY; el.setPointerCapture(e.pointerId); });
    el.addEventListener("pointerup", e => { if (sy !== null && Math.abs(e.clientY - sy) > 12) set(i, digits[i] + (e.clientY < sy ? 1 : -1)); sy = null; });
    el.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") { e.preventDefault(); set(i, digits[i] + 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); set(i, digits[i] - 1); }
      else if (/^\d$/.test(e.key)) { set(i, +e.key); const nx = document.getElementById("dial" + (i + 1)); (nx || document.getElementById("unlock")).focus(); }
      else if (e.key === "Enter") document.getElementById("unlock").click();
    });
  });
  document.getElementById("unlock").onclick = () => {
    if (digits.join("") !== String(L.code)) {
      fb.className = "feedback bad"; fb.textContent = "Access denied. Wrong combination.";
      lockEl.classList.remove("shake"); void lockEl.offsetWidth; lockEl.classList.add("shake");
      return;
    }
    fb.className = "feedback ok"; fb.textContent = "Access granted.";
    lockEl.classList.add("open");
    document.querySelectorAll(".dial-btn, #unlock").forEach(b => b.disabled = true);
    setTimeout(() => { state.phase = "briefing"; render(); }, 1100);
  };
}

function renderBriefing() {
  const b = HUNT.briefing;
  app.innerHTML = `
    <article class="dossier" id="dossier">
      <div class="meta"><span>${esc(b.division)}</span><span>File no. TRD-<span class="redact">0000</span>-YZ</span></div>
      <div class="stamp" aria-hidden="true">CLASSIFIED</div>
      <h1>${esc(b.project)}</h1>
      <p class="sub">${esc(b.label)}</p>
      ${b.body.map(p => `<p>${esc(p)}</p>`).join("")}
      <p class="warn">${esc(b.warning)}</p>
      <p>${esc(b.closing)}</p>
      <p><strong>${esc(b.prompt)}</strong></p>
      <button class="activate" id="activate"><span class="led" aria-hidden="true"></span>Activate</button>
    </article>`;
  document.getElementById("activate").onclick = () => {
    const d = document.getElementById("dossier");
    const go = () => { state = { phase: "hunt", index: 0, log: ["> " + HUNT.malfunction] }; render(); };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return go();
    d.classList.add("glitch");
    d.addEventListener("animationend", go, { once: true });
  };
}

function renderConsole() {
  const c = HUNT.coordinates[state.index];
  app.innerHTML = `
    <section class="console" aria-live="polite">
      <div class="card">
        <h2 class="sr-only">${esc(c.title)}</h2>
        <p class="riddle">${esc(c.riddle)}</p>
        ${PUZZLES[c.type] ? PUZZLES[c.type].markup(c) : `
        <form class="answer" id="form" autocomplete="off">
          <label for="answer" class="sr" hidden>Answer</label>
          <input id="answer" name="answer" placeholder="Enter coordinate key" aria-label="Answer">
          <button class="btn" type="submit">Lock in</button>
        </form>`}
        ${c.type === "faces" ? "" : `<p class="feedback" id="fb"></p>`}
        ${c.hint ? `<div class="row"><button class="btn ghost" id="hintBtn" type="button">Request hint</button></div><p class="hint" id="hint" hidden>${esc(c.hint)}</p>` : ""}
      </div>
      <div class="row"><button class="linkish" id="reset" type="button">Restart mission</button></div>
    </section>`;
  const hb = document.getElementById("hintBtn");
  if (hb) hb.onclick = () => { document.getElementById("hint").hidden = false; hb.hidden = true; };
  bindReset();
  if (PUZZLES[c.type]) return PUZZLES[c.type].bind(c);
  const input = document.getElementById("answer"); input.focus();
  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const fb = document.getElementById("fb");
    const guess = norm(input.value);
    if (!guess) { fb.className = "feedback bad"; fb.textContent = "Enter an answer before locking in."; return; }
    if (c.answers.map(norm).includes(guess)) {
      state.log.push(`> ${c.stamp} locked: "${input.value.trim()}"`);
      state.index++;
      if (state.index >= N) { state.phase = "ready"; renderReady(); save(state); return; }
      render();
    } else {
      fb.className = "feedback bad";
      fb.textContent = "Coordinate rejected. The timeline won't accept that answer. Try again.";
      const form = document.getElementById("form");
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
    }
  };
}

/* ---------- face-swap puzzle ---------- */
const pct = (v, of) => (v / of * 100).toFixed(3) + "%";
function facesMarkup(c) {
  const slots = c.faces.map(([cx, cy, rx, ry], i) => `
    <button type="button" class="fslot" data-i="${i}" aria-label="Empty spot ${i + 1}"
      style="left:${pct(cx - rx, c.width)};top:${pct(cy - ry, c.height)};width:${pct(2 * rx, c.width)};height:${pct(2 * ry, c.height)}"></button>`).join("");
  // real faces plus decoys (people who weren't there); decoys match no spot
  const ids = [...c.faces.map((_, i) => String(i)), ...Array.from({ length: c.decoys || 0 }, (_, k) => "d" + (k + 1))];
  const order = ids.sort(() => Math.random() - .5);
  const src = id => id[0] === "d" ? `assets/face-${id}.png` : `assets/face-${id.padStart(2, "0")}.png`;
  const pieces = order.map((id, n) => `
    <button type="button" class="piece" data-i="${id}" aria-label="Face ${n + 1}">
      <img src="${src(id)}" alt="" draggable="false"></button>`).join("");
  return `
    <div class="viewport" id="viewport">
      <div class="stage" id="stage"><img src="${esc(c.photo)}" alt="Group photo at a hockey game with every face missing" draggable="false">${slots}</div>
    </div>
    <p class="swipe">Swipe the photo sideways to see everyone</p>
    <div class="dock" id="dock">
      <div class="dock-head"><span>Faces restored <strong id="fcount">0/${c.faces.length}</strong></span><p class="feedback" id="fb" aria-live="polite"></p></div>
      <div class="tray" id="tray">${pieces}</div>
    </div>`;
}

function bindFaces(c) {
  const vp = document.getElementById("viewport");
  vp.scrollLeft = 0;
  const stage = document.getElementById("stage"), tray = document.getElementById("tray"), fb = document.getElementById("fb");
  const total = c.faces.length; let placed = 0, selected = null;
  const say = (msg, cls) => { fb.className = "feedback " + (cls || ""); fb.textContent = msg; };
  const select = p => {
    if (selected) selected.classList.remove("selected");
    selected = p && p !== selected ? p : null;
    if (selected) { selected.classList.add("selected"); say("Face selected. Tap the spot where it belongs."); }
  };
  const slotAt = (x, y) => [...stage.querySelectorAll(".fslot:not(.filled)")].find(s => {
    const r = s.getBoundingClientRect(), padX = Math.max(0, 36 - r.width) / 2, padY = Math.max(0, 36 - r.height) / 2;
    return x >= r.left - padX && x <= r.right + padX && y >= r.top - padY && y <= r.bottom + padY;
  });
  const tryPlace = (piece, slot) => {
    if (piece.dataset.i !== slot.dataset.i) {
      say("That face doesn't fit that person. The memory flickers. Try another spot.", "bad");
      slot.classList.remove("shake"); void slot.offsetWidth; slot.classList.add("shake");
      select(null); return;
    }
    slot.classList.add("filled"); slot.disabled = true; slot.setAttribute("aria-label", "Face restored");
    slot.appendChild(piece.querySelector("img")); piece.remove(); selected = null;
    placed++; document.getElementById("fcount").textContent = `${placed}/${total}`;
    if (placed < total) return say("Match confirmed.", "ok");
    say("All faces restored. Memory stabilised.", "ok");
    state.log.push(`> ${c.stamp} locked: identity scramble resolved`);
    tray.outerHTML = `<div class="row"><button class="btn" id="next" type="button">Continue</button></div>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
    save(state);
  };

  stage.addEventListener("click", e => {
    const s = e.target.closest(".fslot");
    if (!s || s.classList.contains("filled")) return;
    if (selected) tryPlace(selected, s); else say("Pick a face from the tray first.");
  });

  tray.addEventListener("pointerdown", e => {
    const piece = e.target.closest(".piece"); if (!piece || e.button > 0) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!ghost) {
        ghost = piece.querySelector("img").cloneNode(); ghost.className = "drag-ghost";
        document.body.appendChild(ghost); piece.classList.add("lifted");
      }
      ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
      const vr = vp.getBoundingClientRect();            // nudge the photo sideways near its edges
      if (ev.clientY > vr.top && ev.clientY < vr.bottom) {
        if (ev.clientX < vr.left + 40) vp.scrollLeft -= 14;
        else if (ev.clientX > vr.right - 40) vp.scrollLeft += 14;
      }
      stage.querySelectorAll(".fslot.hover").forEach(s => s.classList.remove("hover"));
      const s = slotAt(ev.clientX, ev.clientY); if (s) s.classList.add("hover");
    };
    const up = ev => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      stage.querySelectorAll(".fslot.hover").forEach(s => s.classList.remove("hover"));
      if (!ghost) return select(piece);          // a tap, not a drag
      ghost.remove(); piece.classList.remove("lifted");
      const s = ev.type === "pointerup" && slotAt(ev.clientX, ev.clientY);
      if (s) tryPlace(piece, s);
    };
    addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
  // keyboard: Enter/Space on a face selects it, then on a spot places it
  tray.addEventListener("keydown", e => {
    const piece = e.target.closest(".piece");
    if (piece && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(piece); }
  });
}

/* ---------- chronological-order puzzle ---------- */
function orderMarkup(c) {
  let order;
  do { order = c.photos.map((_, i) => i).sort(() => Math.random() - .5); } while (order.every((v, i) => v === i));
  return `
    <div class="order-grid" id="ogrid">${order.map(i => `
      <button type="button" class="opick" data-i="${i}" aria-pressed="false">
        <img src="${esc(c.photos[i].src)}" alt="${esc(c.photos[i].alt)}" draggable="false">
        <span class="badge" hidden></span>
      </button>`).join("")}
    </div>
    <div class="row" id="orow">
      <button class="btn" id="olock" type="button" disabled>Lock in timeline</button>
      <button class="btn ghost" id="oclear" type="button">Clear</button>
    </div>`;
}

function bindOrder(c) {
  const grid = document.getElementById("ogrid"), lock = document.getElementById("olock"), fb = document.getElementById("fb");
  let picks = [];
  const paint = () => {
    grid.querySelectorAll(".opick").forEach(b => {
      const n = picks.indexOf(+b.dataset.i), badge = b.querySelector(".badge");
      b.classList.toggle("picked", n >= 0); b.setAttribute("aria-pressed", n >= 0);
      badge.hidden = n < 0; badge.textContent = n + 1;
    });
    lock.disabled = picks.length !== c.photos.length;
    fb.className = "feedback";
    fb.textContent = picks.length === c.photos.length ? "Timeline assembled. Lock it in."
      : picks.length ? `${picks.length} of ${c.photos.length} placed. Tap a numbered photo to take it back.` : "";
  };
  grid.addEventListener("click", e => {
    const b = e.target.closest(".opick"); if (!b) return;
    const i = +b.dataset.i, n = picks.indexOf(i);
    if (n >= 0) picks.splice(n, 1); else picks.push(i);   // tapping again removes it, later picks shift up
    paint();
  });
  document.getElementById("oclear").onclick = () => { picks = []; paint(); };
  lock.onclick = () => {
    const right = picks.filter((v, i) => v === i).length;
    if (right < c.photos.length) {
      fb.className = "feedback bad";
      fb.textContent = `Timeline rejected. ${right} of ${c.photos.length} memories are in the right place. Try again.`;
      grid.classList.remove("shake"); void grid.offsetWidth; grid.classList.add("shake");
      return;
    }
    fb.className = "feedback ok"; fb.textContent = "Timeline restored. Memories locked in sequence.";
    state.log.push(`> ${c.stamp} locked: timeline fracture repaired`); save(state);
    grid.querySelectorAll(".opick").forEach(b => b.disabled = true);
    document.getElementById("orow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
  };
}

function nyeSkyline() {
  // deterministic pseudo-random so the skyline is the same every time
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let out = "", x = 0;
  while (x < 300) {
    const w = 22 + rnd() * 30, h = 120 + rnd() * 170, y = 400 - h;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${rnd() > .5 ? "#141a2b" : "#10162a"}"/>`;
    for (let wy = y + 8; wy < 380; wy += 10) for (let wx = x + 4; wx < x + w - 4; wx += 7)
      if (rnd() > .62) out += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="4" fill="#f6d58a" opacity="${(.35 + rnd() * .5).toFixed(2)}"/>`;
    x += w + 2;
  }
  // billboards
  const boards = [[8, 210, 54, 38, "#ff4fa3"], [238, 190, 56, 44, "#45d6ff"], [16, 262, 40, 24, "#ffd34d"], [244, 248, 44, 26, "#9b7bff"]];
  boards.forEach(([bx, by, bw, bh, col]) => out += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="2" fill="${col}" opacity=".85"/><rect x="${bx + 4}" y="${by + 4}" width="${bw - 8}" height="${bh - 8}" rx="1" fill="none" stroke="#fff" stroke-opacity=".5"/>`);
  return out;
}

function bindKiss(c) {
  const nye = document.getElementById("nye"), fb = document.getElementById("fb");
  const who = {
    guy:  { el: document.getElementById("guy"),  from: -4, to: 25, p: 0 },
    girl: { el: document.getElementById("girl"), from: 70, to: 41, p: 0 },
  };
  const ball = document.getElementById("ball"), clock = document.getElementById("clock"), count = document.getElementById("count");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // phase: idle -> count (5..1) -> midnight ("Happy New Year" window) -> won | failed
  let phase = "idle", timer = null, t0 = 0;
  const done = () => phase !== "count" && phase !== "midnight";

  const place = w => { w.el.style.left = (w.from + (w.to - w.from) * w.p) + "%"; };
  const kissed = () => who.guy.p === 1 && who.girl.p === 1;
  const setP = (w, p, snap) => {
    if (done()) return;
    w.p = Math.max(0, Math.min(1, p));
    if (snap && w.p > .9) w.p = 1;
    w.el.classList.toggle("arrived", w.p === 1);
    place(w);
    if (kissed()) phase === "count" ? fail("Patience...") : celebrate();
  };

  function tick() {
    const ms = performance.now() - t0;
    if (phase === "count") {
      const left = Math.max(1, 5 - Math.floor(ms / 1000));
      if (count.textContent !== String(left)) {
        count.textContent = left; count.classList.remove("pop"); void count.offsetWidth; count.classList.add("pop");
      }
      clock.textContent = `23:59:${String(60 - left).padStart(2, "0")}`;
      ball.setAttribute("transform", `translate(0 ${(Math.min(1, ms / 5000) * 140).toFixed(1)})`);
      if (ms >= 5000) {
        phase = "midnight"; count.textContent = ""; clock.textContent = "00:00:00";
        nye.classList.add("midnight");
        fb.className = "feedback"; fb.textContent = "";
      }
    } else if (phase === "midnight" && ms >= 5000 + c.window) {
      fail("Midnight came and went without a kiss.");
    }
  }
  function fail(msg) {
    phase = "failed"; clearInterval(timer);
    count.textContent = ""; nye.classList.add("failed");
    document.getElementById("failMsg").textContent = msg;
    document.getElementById("nyeFail").hidden = false;
    fb.className = "feedback bad"; fb.textContent = "Timeline rejected. Replay the moment.";
    document.getElementById("kreplay").focus();
  }
  document.getElementById("kreplay").onclick = () => render();   // rebuilds this coordinate from scratch
  document.getElementById("kstart").onclick = () => {
    document.getElementById("nyeStart").hidden = true;
    phase = "count"; t0 = performance.now(); timer = setInterval(tick, 50); tick();
    fb.className = "feedback"; fb.textContent = "Get them close, but wait for midnight.";
  };
  Object.values(who).forEach(w => {
    place(w);
    w.el.addEventListener("pointerdown", e => {
      if (done() || e.button > 0) return;
      e.preventDefault();
      const rect = nye.getBoundingClientRect(), sx = e.clientX, sp = w.p; let moved = false;
      w.el.setPointerCapture(e.pointerId); w.el.classList.add("held");
      const move = ev => {
        const dx = (ev.clientX - sx) / rect.width * 100;
        if (Math.abs(ev.clientX - sx) > 5) moved = true;
        setP(w, sp + dx / (w.to - w.from), false);
      };
      const up = () => {
        w.el.removeEventListener("pointermove", move); w.el.removeEventListener("pointerup", up); w.el.removeEventListener("pointercancel", up);
        w.el.classList.remove("held");
        setP(w, moved ? w.p : w.p + .25, true);   // a tap takes a step
      };
      w.el.addEventListener("pointermove", move); w.el.addEventListener("pointerup", up); w.el.addEventListener("pointercancel", up);
    });
    w.el.addEventListener("keydown", e => {
      if (done()) return;
      if (["Enter", " ", "ArrowLeft", "ArrowRight"].includes(e.key)) { e.preventDefault(); setP(w, w.p + .25, true); }
    });
  });

  function celebrate() {
    phase = "won"; clearInterval(timer);
    nye.classList.add("kissing");
    fb.className = "feedback ok"; fb.textContent = "Right on time. Memory unlocked.";
    if (!reduce) fireworks(document.getElementById("fx"), nye);
    setTimeout(() => {
      document.getElementById("nyePhoto").hidden = false;
      requestAnimationFrame(() => nye.classList.add("revealed"));
      state.log.push(`> ${c.stamp} locked: midnight protocol complete`); save(state);
      const row = document.getElementById("krow");
      row.innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
      document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
    }, reduce ? 600 : 3200);
  }
}

function fireworks(cv, host) {
  const dpr = Math.min(2, devicePixelRatio || 1), r = host.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cols = ["#ffd34d", "#ff5d7a", "#45d6ff", "#ffffff", "#b9a3ff", "#f2a93b"];
  const parts = []; let bursts = 0;
  const burst = () => {
    const x = r.width * (.2 + Math.random() * .6), y = r.height * (.12 + Math.random() * .3), col = cols[bursts++ % cols.length];
    for (let i = 0; i < 46; i++) { const a = Math.PI * 2 * i / 46, v = 1.2 + Math.random() * 2.2;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col }); }
  };
  burst(); const iv = setInterval(() => (bursts < 9 ? burst() : clearInterval(iv)), 380);
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, r.width, r.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.vx *= .985; p.life -= .012;
      if (p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 2.4, 2.4); } });
    ctx.globalAlpha = 1;
    if (t - t0 < 6000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, r.width, r.height);
  })(t0);
}

function bindWhere(c) {
  const fb = document.getElementById("fb"), lock = document.getElementById("wlock");
  const cal = document.getElementById("cal"), svg = document.getElementById("mapsvg"), pin = document.getElementById("pin");
  const ym = s => s.split("-").map(Number);
  let [vy, vm] = ym(c.calStart), picked = null, pinAt = null, solved = false;
  const [miny, minm] = ym(c.calMin), [maxy, maxm] = ym(c.calMax);
  const fmt = iso => { const [y, m, d] = ym(iso); return `${MONTHS[m - 1].slice(0, 3)} ${d}, ${y}`; };
  const ready = () => { lock.disabled = !(picked && pinAt); };

  function drawCal() {
    const first = new Date(vy, vm - 1, 1).getDay(), days = new Date(vy, vm, 0).getDate();
    const atMin = vy * 12 + vm <= miny * 12 + minm, atMax = vy * 12 + vm >= maxy * 12 + maxm;
    let cells = "";
    for (let i = 0; i < first; i++) cells += `<span></span>`;
    for (let d = 1; d <= days; d++) {
      const iso = `${vy}-${String(vm).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      cells += `<button type="button" class="day${iso === picked ? " on" : ""}" data-iso="${iso}" ${solved ? "disabled" : ""}
        aria-pressed="${iso === picked}" aria-label="${fmt(iso)}">${d}</button>`;
    }
    cal.innerHTML = `
      <div class="cal-head">
        <button type="button" class="cal-nav" id="prev" aria-label="Previous month" ${atMin || solved ? "disabled" : ""}>‹</button>
        <strong>${MONTHS[vm - 1]} ${vy}</strong>
        <button type="button" class="cal-nav" id="nextm" aria-label="Next month" ${atMax || solved ? "disabled" : ""}>›</button>
      </div>
      <div class="cal-grid cal-dow">${["S","M","T","W","T","F","S"].map(x => `<span>${x}</span>`).join("")}</div>
      <div class="cal-grid">${cells}</div>`;
    document.getElementById("prev").onclick = () => { vm--; if (vm < 1) { vm = 12; vy--; } drawCal(); };
    document.getElementById("nextm").onclick = () => { vm++; if (vm > 12) { vm = 1; vy++; } drawCal(); };
  }
  cal.addEventListener("click", e => {
    const b = e.target.closest(".day"); if (!b) return;
    picked = b.dataset.iso; document.getElementById("wDate").textContent = fmt(picked);
    document.getElementById("wDate").classList.add("set"); drawCal(); ready();
  });

  svg.addEventListener("click", e => {
    if (solved) return;
    const r = svg.getBoundingClientRect();
    pinAt = [(e.clientX - r.left) / r.width * DC_MAP.w, (e.clientY - r.top) / r.height * DC_MAP.h];
    pin.style.display = ""; pin.setAttribute("transform", `translate(${pinAt[0].toFixed(1)} ${pinAt[1].toFixed(1)})`);
    const chip = document.getElementById("wLoc"); chip.textContent = "Pin dropped"; chip.classList.add("set"); ready();
  });

  const inside = ([x, y], poly) => {
    let inn = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inn = !inn;
    }
    return inn;
  };
  const edgeDist = ([x, y], poly) => Math.min(...poly.map((a, i) => {
    const b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dy = b[1] - a[1];
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy);
  }));

  lock.onclick = () => {
    const dateOk = picked === c.date;
    const placeOk = inside(pinAt, c.zone) || edgeDist(pinAt, c.zone) <= c.tolerancePx * DC_MAP.w / svg.getBoundingClientRect().width;
    if (!(dateOk && placeOk)) {
      fb.className = "feedback bad";
      fb.textContent = `Coordinates rejected. Date: ${dateOk ? "confirmed" : "wrong"}. Location: ${placeOk ? "confirmed" : "wrong"}.`;
      return;
    }
    solved = true; drawCal();
    document.getElementById("zone").classList.add("found");
    document.getElementById("wLoc").textContent = c.place;
    fb.className = "feedback ok"; fb.textContent = `Coordinates locked: ${c.place}, ${fmt(c.date)}.`;
    state.log.push(`> ${c.stamp} locked: ${c.place}, ${fmt(c.date)}`); save(state);
    document.getElementById("wrow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
  };
  drawCal();
}

    <div class="row" id="wokRow"></div>`;

function bindWok(c) {
  const cv = document.getElementById("wokCv"), stage = document.getElementById("wokStage"), fb = document.getElementById("fb");
  const ctx = cv.getContext("2d");
  // all geometry in stage units: 0..1 across the square stage
  const R = .27, FR = .095, FLAME = { x: .5, y: .5 };
  const H0 = 1.25 * R, H1 = 2.35 * R;              // handle danger segment, measured from the wok centre
  const DANGER = FR * 1.45, WARN = FR * 2.8;   // very touchy: the grip ignites just short of the visible flame
  const N = 48, heat = new Float32Array(N * N), inside = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const lx = ((i + .5) / N * 2 - 1) * R, ly = ((j + .5) / N * 2 - 1) * R;
    if (Math.hypot(lx, ly) <= R * .96) inside.push(j * N + i);
  }
  const wok = { x: .36, y: .5 };
  let phase = "play", warm = 0, last = performance.now(), size = 0, dpr = 1;
  const tex = document.createElement("canvas"); tex.width = tex.height = N;
  const tctx = tex.getContext("2d"), img = tctx.createImageData(N, N);

  const STOPS = [[0, [199, 203, 209]], [.3, [201, 164, 92]], [.55, [138, 90, 122]], [.75, [63, 84, 134]], [1, [27, 27, 30]]];
  const steel = h => {
    h = Math.min(1, h);
    for (let k = 1; k < STOPS.length; k++) if (h <= STOPS[k][0]) {
      const [a, ca] = STOPS[k - 1], [b, cb] = STOPS[k], t = (h - a) / (b - a);
      return ca.map((v, n) => v + (cb[n] - v) * t);
    }
    return STOPS[STOPS.length - 1][1];
  };
  const resize = () => {
    dpr = Math.min(2, devicePixelRatio || 1); size = stage.clientWidth;
    cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + "px";
  };
  resize(); addEventListener("resize", resize);

  const segDist = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  };

  function step(dt) {
    if (phase !== "play") return;
    for (const k of inside) {
      const i = k % N, j = (k / N) | 0;
      const wx = wok.x + ((i + .5) / N * 2 - 1) * R, wy = wok.y + ((j + .5) / N * 2 - 1) * R;
      const d = Math.hypot(wx - FLAME.x, wy - FLAME.y);
      if (d < FR) heat[k] = Math.min(1.2, heat[k] + dt * .95 * (1 - .55 * d / FR));
    }
    const hd = segDist(FLAME.x, FLAME.y, wok.x + H0, wok.y, wok.x + H1, wok.y);
    warm = Math.max(0, Math.min(1, (WARN - hd) / (WARN - DANGER)));
    if (hd < DANGER) return fail();
    const done = inside.reduce((n, k) => n + (heat[k] >= 1), 0) / inside.length;
    const pct = Math.floor(done * 100);
    document.getElementById("wokBar").style.width = pct + "%";
    document.getElementById("wokPct").textContent = pct + "%";
    if (done >= .96) win();
  }

  function draw(t) {
    const s = size * dpr; ctx.setTransform(s, 0, 0, s, 0, 0);
    // stovetop and grate
    ctx.fillStyle = "#14171d"; ctx.fillRect(0, 0, 1, 1);
    ctx.strokeStyle = "#262b34"; ctx.lineWidth = .018;
    for (let a = 0; a < 6; a++) { const an = a * Math.PI / 3; ctx.beginPath();
      ctx.moveTo(FLAME.x + Math.cos(an) * .12, FLAME.y + Math.sin(an) * .12); ctx.lineTo(FLAME.x + Math.cos(an) * .42, FLAME.y + Math.sin(an) * .42); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(FLAME.x, FLAME.y, .42, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#2c313a"; ctx.beginPath(); ctx.arc(FLAME.x, FLAME.y, .07, 0, Math.PI * 2); ctx.fill();
    // flame: ring of flickering blue tongues
    for (let k = 0; k < 14; k++) {
      const an = k / 14 * Math.PI * 2, fl = .75 + .25 * Math.sin(t / 90 + k * 1.7);
      const fx = FLAME.x + Math.cos(an) * .055, fy = FLAME.y + Math.sin(an) * .055;
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, .045 * fl);
      g.addColorStop(0, "rgba(140,200,255,.95)"); g.addColorStop(.5, "rgba(60,110,255,.55)"); g.addColorStop(1, "rgba(60,110,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, .045 * fl, 0, Math.PI * 2); ctx.fill();
    }
    const glow = ctx.createRadialGradient(FLAME.x, FLAME.y, 0, FLAME.x, FLAME.y, FR * 1.4);
    glow.addColorStop(0, "rgba(255,170,80,.25)"); glow.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(FLAME.x, FLAME.y, FR * 1.4, 0, Math.PI * 2); ctx.fill();

    // wok shadow
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.ellipse(wok.x + .02, wok.y + .03, R * 1.02, R * 1.0, 0, 0, Math.PI * 2); ctx.fill();
    // handle: steel bracket, then wooden grip
    ctx.fillStyle = "#8e939b"; ctx.fillRect(wok.x + R * .9, wok.y - .016, H0 - R * .9 + .01, .032);
    const wood = [107, 74, 47], hot = [214, 70, 40], w = wood.map((v, n) => Math.round(v + (hot[n] - v) * warm));
    ctx.fillStyle = phase === "fail" ? "#2a1a12" : `rgb(${w})`;
    ctx.beginPath(); ctx.roundRect(wok.x + H0, wok.y - .027, H1 - H0, .054, .027); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(wok.x + H0 + .01, wok.y - .02, H1 - H0 - .03, .008);
    if (warm > 0 && phase === "play") {
      ctx.fillStyle = `rgba(255,120,60,${(.35 * warm).toFixed(2)})`;
      ctx.beginPath(); ctx.roundRect(wok.x + H0 - .01, wok.y - .037, H1 - H0 + .02, .074, .037); ctx.fill();
    }
    // seasoned steel texture
    for (let k = 0; k < N * N; k++) { const [r, g, b] = steel(heat[k]); img.data.set([r, g, b, 255], k * 4); }
    tctx.putImageData(img, 0, 0);
    ctx.save(); ctx.beginPath(); ctx.arc(wok.x, wok.y, R, 0, Math.PI * 2); ctx.clip();
    ctx.imageSmoothingEnabled = true; ctx.drawImage(tex, wok.x - R, wok.y - R, 2 * R, 2 * R);
    const bowl = ctx.createRadialGradient(wok.x - R * .25, wok.y - R * .3, R * .05, wok.x, wok.y, R);
    bowl.addColorStop(0, "rgba(255,255,255,.28)"); bowl.addColorStop(.35, "rgba(255,255,255,0)");
    bowl.addColorStop(.8, "rgba(0,0,0,.1)"); bowl.addColorStop(1, "rgba(0,0,0,.45)");
    ctx.fillStyle = bowl; ctx.fillRect(wok.x - R, wok.y - R, 2 * R, 2 * R);
    // hot spot: shows where the flame is under the steel
    const pulse = .3 + .06 * Math.sin(t / 160);
    const hotg = ctx.createRadialGradient(FLAME.x, FLAME.y, 0, FLAME.x, FLAME.y, FR * 1.15);
    hotg.addColorStop(0, `rgba(255,150,60,${pulse.toFixed(2)})`); hotg.addColorStop(.7, "rgba(255,110,40,.12)"); hotg.addColorStop(1, "rgba(255,110,40,0)");
    ctx.fillStyle = hotg; ctx.beginPath(); ctx.arc(FLAME.x, FLAME.y, FR * 1.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#9aa0a8"; ctx.lineWidth = .012; ctx.beginPath(); ctx.arc(wok.x, wok.y, R, 0, Math.PI * 2); ctx.stroke();
    // handle fire
    if (phase === "fail") for (let k = 0; k < 9; k++) {
      const fx = wok.x + H0 + (H1 - H0) * (k + .5) / 9, h = .05 + .03 * Math.sin(t / 70 + k * 2.1);
      const g = ctx.createRadialGradient(fx, wok.y - h * .4, 0, fx, wok.y - h * .4, h);
      g.addColorStop(0, "rgba(255,240,150,.95)"); g.addColorStop(.45, "rgba(255,130,30,.8)"); g.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, wok.y - h * .4, h, 0, Math.PI * 2); ctx.fill();
    }
  }

  function frame(t) {
    if (!document.body.contains(cv)) { removeEventListener("resize", resize); return; }   // left this coordinate
    step(Math.min(.05, (t - last) / 1000)); last = t; draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function fail() {
    phase = "fail";
    document.getElementById("wokFail").hidden = false;
    fb.className = "feedback bad"; fb.textContent = "Handle on fire. Seasoning lost.";
    document.getElementById("wokRetry").focus();
  }
  document.getElementById("wokRetry").onclick = () => render();
  function win() {
    phase = "won"; heat.fill(1.2);
    document.getElementById("wokBar").style.width = "100%"; document.getElementById("wokPct").textContent = "100%";
    fb.className = "feedback ok"; fb.textContent = "Perfectly seasoned. Memory locked in.";
    state.log.push(`> ${c.stamp} locked: wok seasoned`); save(state);
    document.getElementById("wokRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N_COORDS() ? (state.phase = "ready", save(state), renderReady()) : render(); };
  }

  // drag anywhere on the stove: the wok keeps its offset from your finger
  cv.addEventListener("pointerdown", e => {
    if (phase !== "play") return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const r = cv.getBoundingClientRect(), ox = wok.x - (e.clientX - r.left) / r.width, oy = wok.y - (e.clientY - r.top) / r.height;
    const move = ev => {
      wok.x = Math.max(.08, Math.min(.92, (ev.clientX - r.left) / r.width + ox));
      wok.y = Math.max(.08, Math.min(.92, (ev.clientY - r.top) / r.height + oy));
    };
    const up = () => { cv.removeEventListener("pointermove", move); cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up); };
    cv.addEventListener("pointermove", move); cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  });
  cv.addEventListener("keydown", e => {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d || phase !== "play") return;
    e.preventDefault();
    wok.x = Math.max(.08, Math.min(.92, wok.x + d[0] * .02)); wok.y = Math.max(.08, Math.min(.92, wok.y + d[1] * .02));
  });
}
const N_COORDS = () => N;

/* ---------- volleyball puzzle ---------- */
function volleyMarkup(c) {
  return `
    <div class="vb-board" aria-live="polite">
      <span class="vb-league">${esc(c.league)}</span>
      <span class="vb-team">${esc(c.home)}</span><strong id="vbHome">0</strong>
      <span class="vb-dash">–</span>
      <strong id="vbAway">0</strong><span class="vb-team">${esc(c.away)}</span>
    </div>
    <div class="vb-stage" id="vbStage">
      <canvas id="vbCv" tabindex="0" aria-label="Volleyball court. Tap, or press Space, when the rings line up."></canvas>
      <div class="nye-overlay" id="vbStart"><p>First to ${c.target} wins. Tap anywhere when the rings line up.</p><button class="btn" id="vbGo" type="button">Start the set</button></div>
      <div class="nye-overlay" id="vbLose" hidden><p id="vbLoseMsg"></p><button class="btn" id="vbRetry" type="button">Replay the set</button></div>
      ${c.photo ? `<figure class="nye-photo" id="vbPhoto" hidden><img src="${esc(c.photo)}" alt="${esc(c.photoAlt)}"><figcaption><span>Memory recovered</span>${esc(c.caption)}</figcaption></figure>` : ""}
    </div>
    <div class="row" id="vbRow"></div>`;
}

function bindVolley(c) {
  const cv = document.getElementById("vbCv"), stage = document.getElementById("vbStage"), fb = document.getElementById("fb");
  const ctx = cv.getContext("2d"), AR = 1.25;          // stage is 1 wide, 1.25 tall
  const FLOOR = 1.05, NET_X = .56, NET_TOP = .63;
  const P = { serve: [.9, .74], bump: [.34, .88], set: [.32, .69], spike: [.37, .5], land: [.84, 1.03] };
  // each flight: from, to, arc height, seconds, what the next tap does
  const FLIGHTS = {
    serve: { a: P.serve, b: P.bump,  lift: .28, T: 1.35, tap: "BUMP" },
    bump:  { a: P.bump,  b: P.set,   lift: .42, T: 1.1,  tap: "SET" },
    set:   { a: P.set,   b: P.spike, lift: .3,  T: .9,   tap: "SPIKE" },
    spike: { a: P.spike, b: P.land,  lift: -.02, T: .32 },
  };
  const NEXT = { serve: "bump", bump: "set", set: "spike" };
  let home = 0, away = 0, phase = "idle", flight = null, t = 0, speed = 1, pose = "ready", poseT = 0, missed = false;
  let callout = null, size = 0, dpr = 1, last = performance.now();
  const ballAt = (f, tt) => {
    const u = tt / (f.T / speed), [ax, ay] = f.a, [bx, by] = f.b;
    return [ax + (bx - ax) * u, ay + (by - ay) * u - f.lift * 4 * u * (1 - u)];
  };
  const resize = () => {
    dpr = Math.min(2, devicePixelRatio || 1); size = stage.clientWidth;
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * AR * dpr);
    cv.style.width = size + "px"; cv.style.height = size * AR + "px";
  };
  resize(); addEventListener("resize", resize);
  const say = (txt, col) => { callout = { txt, col, t: 0 }; };
  const score = () => { document.getElementById("vbHome").textContent = home; document.getElementById("vbAway").textContent = away; };

  function launch(name) { flight = { ...FLIGHTS[name], name }; t = 0; missed = false; }
  function serve() { phase = "rally"; pose = "ready"; launch("serve"); }

  function tap() {
    if (phase !== "rally" || missed || !flight.tap) return;
    const T = flight.T / speed, win = .1 / Math.sqrt(speed);
    if (Math.abs(t - T) <= win) {
      const action = flight.tap; say(action + "!", "#f2a93b");
      pose = action.toLowerCase(); poseT = 0;
      launch(action === "SPIKE" ? "spike" : NEXT[flight.name]);
    } else {
      missed = true; say(t < T ? "Too early!" : "Too late!", "#ef6b5b");
    }
  }

  function pointEnd(won) {
    phase = "between";
    if (won) { home++; say("Kill!", "#6fcf97"); } else { away++; if (!callout || callout.t > .5) say("Point: " + c.away, "#ef6b5b"); }
    score(); speed *= 1.05;
    setTimeout(() => {
      if (!document.body.contains(cv)) return;
      if (home >= c.target) return winSet();
      if (away >= c.target) return loseSet();
      serve();
    }, 1000);
  }

  function step(dt) {
    poseT += dt; if (callout) callout.t += dt;
    if (phase !== "rally") return;
    t += dt;
    const T = flight.T / speed, [, y] = ballAt(flight, t);
    if (flight.name === "spike") { if (t >= T) pointEnd(true); return; }
    if (!missed && t > T + .1 / Math.sqrt(speed)) { missed = true; say("Missed it!", "#ef6b5b"); }
    if (missed && y >= FLOOR - .02) pointEnd(false);
  }

  function drawPlayer(x, jump) {
    const fy = FLOOR - jump;
    ctx.lineCap = "round";
    // legs
    ctx.strokeStyle = "#1f2a44"; ctx.lineWidth = .028;
    const knee = pose === "bump" && poseT < .4 ? .03 : 0;
    ctx.beginPath(); ctx.moveTo(x - .02, fy - .12); ctx.lineTo(x - .035 - knee, fy - .06); ctx.lineTo(x - .03, fy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + .02, fy - .12); ctx.lineTo(x + .035 + knee, fy - .06); ctx.lineTo(x + .04, fy); ctx.stroke();
    // torso
    ctx.fillStyle = "#24345c"; ctx.beginPath(); ctx.roundRect(x - .045, fy - .26 + knee, .09, .15, .025); ctx.fill();
    // arms by pose
    ctx.strokeStyle = "#c98f6a"; ctx.lineWidth = .02;
    const sx = x + .02, sy = fy - .235 + knee, p = poseT < .45 ? pose : "ready";
    const hands = { ready: [x + .06, fy - .17], bump: [x + .085, fy - .16], set: [x + .04, fy - .36], spike: [x + .06, fy - .4] }[p];
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hands[0], hands[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - .03, sy); ctx.lineTo(hands[0] - .012, hands[1] + .006); ctx.stroke();
    // head, curly hair, glasses
    const hx = x + .005, hy = fy - .3 + knee;
    ctx.fillStyle = "#d29b74"; ctx.beginPath(); ctx.arc(hx, hy, .042, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1b1612";
    for (let k = 0; k < 7; k++) { const an = Math.PI * (1.05 + k * .14); ctx.beginPath(); ctx.arc(hx + Math.cos(an) * .036, hy + Math.sin(an) * .036 - .008, .019, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = "#222"; ctx.lineWidth = .006; ctx.strokeRect(hx + .008, hy - .006, .028, .016);
    ctx.beginPath(); ctx.moveTo(hx + .008, hy); ctx.lineTo(hx - .03, hy - .004); ctx.stroke();
  }

  function draw(now) {
    const s = size * dpr; ctx.setTransform(s, 0, 0, s, 0, 0);
    // outdoor: sky, sun, tree line, grass
    const sky = ctx.createLinearGradient(0, 0, 0, FLOOR); sky.addColorStop(0, "#5aa7e6"); sky.addColorStop(1, "#bfe1f5");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1, FLOOR);
    const sun = ctx.createRadialGradient(.84, .14, 0, .84, .14, .16); sun.addColorStop(0, "rgba(255,248,214,1)"); sun.addColorStop(.3, "rgba(255,240,180,.8)"); sun.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(.84, .14, .16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    [[.18, .17, .07], [.25, .15, .05], [.12, .18, .045], [.6, .3, .05], [.66, .29, .035]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "#3f7a4a";
    for (let k = 0; k < 14; k++) { const x = k * .08 - .02, r = .06 + (k * 37 % 5) * .008; ctx.beginPath(); ctx.arc(x, FLOOR - .1 - (k * 53 % 4) * .01, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#356b40"; ctx.fillRect(0, FLOOR - .1, 1, .1);
    const grass = ctx.createLinearGradient(0, FLOOR, 0, AR); grass.addColorStop(0, "#5f9e3e"); grass.addColorStop(1, "#4a8a2f");
    ctx.fillStyle = grass; ctx.fillRect(0, FLOOR, 1, AR - FLOOR);
    ctx.fillStyle = "rgba(255,255,255,.07)"; for (let k = 0; k < 6; k++) ctx.fillRect(k * .2, FLOOR, .1, AR - FLOOR);   // mow stripes
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(.04, FLOOR + .012, .92, .006);   // painted sideline
    // far-side opponents (silhouettes)
    [[.72, "#b8875f"], [.9, "#8a5c3e"]].forEach(([ox, skin]) => {
      ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = .026; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ox - .018, FLOOR - .12); ctx.lineTo(ox - .025, FLOOR); ctx.moveTo(ox + .018, FLOOR - .12); ctx.lineTo(ox + .025, FLOOR); ctx.stroke();
      ctx.fillStyle = "#b5352f"; ctx.beginPath(); ctx.roundRect(ox - .043, FLOOR - .26, .086, .15, .025); ctx.fill();
      ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(ox, FLOOR - .3, .038, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#231a14"; ctx.beginPath(); ctx.arc(ox, FLOOR - .315, .036, Math.PI, Math.PI * 2); ctx.fill();
    });
    // net
    ctx.fillStyle = "#cfd4dc"; ctx.fillRect(NET_X - .006, NET_TOP - .02, .012, FLOOR - NET_TOP + .02);
    ctx.fillStyle = "rgba(230,234,240,.9)"; ctx.fillRect(NET_X - .012, NET_TOP, .024, .016);
    ctx.fillStyle = "rgba(20,24,32,.25)"; ctx.fillRect(NET_X - .012, NET_TOP + .016, .024, .244);
    ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = .003;
    for (let y = NET_TOP + .03; y < NET_TOP + .26; y += .022) { ctx.beginPath(); ctx.moveTo(NET_X - .012, y); ctx.lineTo(NET_X + .012, y); ctx.stroke(); }
    ctx.fillStyle = "rgba(230,234,240,.9)"; ctx.fillRect(NET_X - .012, NET_TOP + .26, .024, .008);

    // player (jumps while the set is coming down for the spike)
    let jump = 0;
    if (phase === "rally" && flight.name === "set") { const rem = flight.T / speed - t; if (rem < .45) jump = Math.max(0, .14 * Math.sin(Math.PI * (1 - rem / .45) * .5 + .0)); }
    if (pose === "spike" && poseT < .35) jump = .14 * (1 - poseT / .35);
    drawPlayer(.28, jump);

    if (flight && phase !== "idle") {
      const [bx, by] = ballAt(flight, t), T = flight.T / speed;
      // timing rings
      if (flight.tap && !missed) {
        const rem = T - t, [tx, ty] = flight.b;
        ctx.lineWidth = .014; ctx.strokeStyle = "rgba(10,14,22,.35)";
        ctx.beginPath(); ctx.arc(tx, ty, .045, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = .008; ctx.strokeStyle = "rgba(242,169,59,1)";
        ctx.beginPath(); ctx.arc(tx, ty, .045, 0, Math.PI * 2); ctx.stroke();
        if (rem > -0.05 && rem < .8) {
          ctx.strokeStyle = `rgba(242,169,59,${Math.max(.25, 1 - rem).toFixed(2)})`;
          ctx.beginPath(); ctx.arc(tx, ty, .045 + Math.max(0, rem) * .22, 0, Math.PI * 2); ctx.stroke();
        }
      }
      // ball shadow + ball
      const clampY = Math.min(by, FLOOR - .028);
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(bx, FLOOR + .004, .03, .007, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f4f1e8"; ctx.beginPath(); ctx.arc(bx, clampY, .028, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#2f5fb3"; ctx.lineWidth = .006;
      const spin = now / 200;
      ctx.beginPath(); ctx.arc(bx, clampY, .028, spin, spin + 1.6); ctx.stroke();
      ctx.strokeStyle = "#e9b93a"; ctx.beginPath(); ctx.arc(bx, clampY, .02, spin + 2.6, spin + 4); ctx.stroke();
    }

      ctx.globalAlpha = Math.max(0, 1 - callout.t / .9);
      ctx.fillStyle = callout.col; ctx.textAlign = "center";
      ctx.font = `900 ${.11}px "Big Shoulders Stencil Display", Impact, sans-serif`;
      ctx.lineWidth = .012; ctx.strokeStyle = "rgba(10,14,22,.85)"; ctx.lineJoin = "round";
      ctx.strokeText(callout.txt, .5, .3 - callout.t * .06);
      ctx.fillText(callout.txt, .5, .3 - callout.t * .06);
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    if (!document.body.contains(cv)) { removeEventListener("resize", resize); return; }
    step(Math.min(.05, (now - last) / 1000)); last = now; draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function winSet() {
    phase = "won";
    fb.className = "feedback ok"; fb.textContent = `Set won ${home}–${away}. The league lives on.`;
    state.log.push(`> ${c.stamp} locked: set won ${home}-${away}`); save(state);
    const ph = document.getElementById("vbPhoto");
    if (ph) { ph.hidden = false; requestAnimationFrame(() => ph.classList.add("show")); }
    document.getElementById("vbRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
  }
  function loseSet() {
    phase = "lost";
    document.getElementById("vbLoseMsg").textContent = `${c.away} took the set ${away}–${home}. The founder doesn't lose in his own league.`;
    document.getElementById("vbLose").hidden = false;
    fb.className = "feedback bad"; fb.textContent = "Set lost. Run it back.";
  }
  document.getElementById("vbRetry").onclick = () => render();
  document.getElementById("vbGo").onclick = e => { e.stopPropagation(); document.getElementById("vbStart").hidden = true; cv.focus(); setTimeout(serve, 400); };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  cv.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); tap(); } });
}

/* ---------- spot-the-forgery puzzle ---------- */
function spotMarkup(c) {
  const order = c.photos.map((_, i) => i).sort(() => Math.random() - .5);
  return `
    <div class="spot-thumbs" id="spotThumbs" role="tablist">${order.map((i, n) => `
      <button type="button" class="spot-thumb${n === 0 ? " on" : ""}" data-i="${i}" role="tab" aria-selected="${n === 0}" aria-label="Copy ${"ABCD"[n]}">
        <img src="${esc(c.photos[i].src)}" alt="" draggable="false"><span>${"ABCD"[n]}</span></button>`).join("")}
    </div>
    <div class="spot-view" id="spotView"><img id="spotImg" src="${esc(c.photos[order[0]].src)}" alt="${esc(c.alt)}" draggable="false"></div>
    <p class="map-note" id="spotNote">Tap the photo to zoom in, drag to look around, tap again to zoom out.</p>
    <div class="row" id="spotRow">
      <button class="btn" id="spotPick" type="button">Copy A is the real one</button>
      <span class="chip" id="spotStrikes">Strikes 0/${c.strikes}</span>
    </div>`;
}

function bindSpot(c) {
  const view = document.getElementById("spotView"), img = document.getElementById("spotImg"), fb = document.getElementById("fb");
  const thumbs = [...document.querySelectorAll(".spot-thumb")], pick = document.getElementById("spotPick");
  let cur = +thumbs[0].dataset.i, strikes = 0, z = 1, tx = 0, ty = 0, solved = false;
  const letter = i => "ABCD"[thumbs.findIndex(t => +t.dataset.i === i)];
  const apply = anim => { img.style.transition = anim ? "transform .25s ease" : "none"; img.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`; };
  const clamp = () => { const w = view.clientWidth, h = view.clientHeight; tx = Math.min(0, Math.max(w - w * z, tx)); ty = Math.min(0, Math.max(h - h * z, ty)); };
  const show = i => {
    cur = i; img.src = c.photos[i].src; z = 1; tx = ty = 0; apply(false);
    thumbs.forEach(t => { const on = +t.dataset.i === i; t.classList.toggle("on", on); t.setAttribute("aria-selected", on); });
    const t = thumbs.find(t => +t.dataset.i === i);
    pick.disabled = solved || t.classList.contains("fake");
    pick.textContent = t.classList.contains("fake") ? `Copy ${letter(i)} is a forgery` : `Copy ${letter(i)} is the real one`;
  };
  thumbs.forEach(t => t.onclick = () => show(+t.dataset.i));

  view.addEventListener("pointerdown", e => {
    e.preventDefault(); view.setPointerCapture(e.pointerId);
    const r = view.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, stx = tx, sty = ty; let moved = false;
    const move = ev => {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
      if (moved && z > 1) { tx = stx + ev.clientX - sx; ty = sty + ev.clientY - sy; clamp(); apply(false); }
    };
    const up = ev => {
      view.removeEventListener("pointermove", move); view.removeEventListener("pointerup", up); view.removeEventListener("pointercancel", up);
      if (moved || ev.type === "pointercancel") return;
      if (z === 1) { z = 3.2; const px = ev.clientX - r.left, py = ev.clientY - r.top; tx = px - px * z; ty = py - py * z; clamp(); }
      else { z = 1; tx = ty = 0; }
      apply(true);
    };
    view.addEventListener("pointermove", move); view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
  });

  pick.onclick = () => {
    const p = c.photos[cur], t = thumbs.find(t => +t.dataset.i === cur);
    if (p.real) {
      solved = true; t.classList.add("real"); thumbs.forEach(x => x !== t && x.classList.add("fake"));
      fb.className = "feedback ok"; fb.textContent = "Authentic memory confirmed.";
      state.log.push(`> ${c.stamp} locked: forgery detected`); save(state);
      document.getElementById("spotRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
      document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
      return;
    }
    strikes++; t.classList.add("fake"); show(cur);
    document.getElementById("spotStrikes").textContent = `Strikes ${strikes}/${c.strikes}`;
    if (strikes >= c.strikes) {
      fb.className = "feedback bad"; fb.textContent = `Forgery again. The copies are reshuffling...`;
      pick.disabled = true; thumbs.forEach(x => x.disabled = true);
      setTimeout(() => document.body.contains(view) && render(), 1800);
    } else {
      fb.className = "feedback bad"; fb.textContent = `Copy ${letter(cur)} is a forgery. One strike left.`;
    }
  };
}

/* ---------- fill-in-the-blank puzzle ---------- */
function blanksMarkup(c) {
  return `
    <div class="bl-photo"><img id="blImg" src="${esc(c.photo)}" alt="${esc(c.photoAlt)}" draggable="false"><span class="bl-caption" id="blCap" hidden>${esc(c.caption)}</span></div>
    <div class="bl-dots" id="blDots">${c.lines.map((_, i) => `<i class="${i === 0 ? "cur" : ""}"></i>`).join("")}</div>
    <div class="bl-card" id="blCard"></div>`;
}

function bindBlanks(c) {
  const img = document.getElementById("blImg"), card = document.getElementById("blCard"), fb = document.getElementById("fb");
  const total = c.lines.length; let at = 0;
  const focus = () => { img.style.filter = `blur(${(22 * (1 - at / total)).toFixed(1)}px) saturate(${(.4 + .6 * at / total).toFixed(2)})`; };
  const dots = () => [...document.querySelectorAll("#blDots i")].forEach((d, i) => d.className = i < at ? "done" : i === at ? "cur" : "");
  function show() {
    const L = c.lines[at], parts = L.text.split(/_{3,}(?:\s+_{3,})*/), gaps = parts.length - 1;   // blanks separated only by spaces count as one
    // words per gap come from the first answer: the whole answer for one gap, or split on "/" for several
    const ans = L.answers[0] || "", count = t => t.trim().split(/\s+/).filter(Boolean).length;
    let groups = gaps === 1 ? [count(ans.replace(/\//g, " "))] : ans.split("/").map(count);
    if (groups.length !== gaps || groups.some(n => !n)) groups = null;   // can't tell the split: fall back to numbered gaps
    const slots = n => `<span class="bl-slots">${Array.from({ length: n }, () => `<span class="bl-slot"></span>`).join("")}</span>`;
    const lineHTML = parts.map((p, i) => esc(p) + (i < gaps ? (groups ? slots(groups[i]) : `<span class="bl-gap">${i + 1}</span>`) : "")).join("");
    const totalWords = groups ? groups.reduce((a, b) => a + b, 0) : 0;
    card.innerHTML = `
      <span class="eyebrow">Line ${at + 1} of ${total}</span>
      <p class="bl-line">${lineHTML}</p>
      <form class="answer" id="blForm" autocomplete="off">
        <input id="blIn" aria-label="Missing words" placeholder="${totalWords ? `${totalWords} missing word${totalWords > 1 ? "s" : ""}${gaps > 1 ? ", in order" : ""}` : "All missing words, in order"}">
        <button class="btn" type="submit">Lock in</button>
      </form>
      ${L.hint ? `<div class="row"><button class="btn ghost" id="blHint" type="button">Hint for this line</button></div><p class="hint" id="blHintText" hidden>${esc(L.hint)}</p>` : ""}`;
    const input = document.getElementById("blIn"); input.focus({ preventScroll: true });
    const hb = document.getElementById("blHint");
    if (hb) hb.onclick = () => { document.getElementById("blHintText").hidden = false; hb.hidden = true; };
    document.getElementById("blForm").onsubmit = e => {
      e.preventDefault();
      const guess = norm(input.value);
      if (!guess) { fb.className = "feedback bad"; fb.textContent = "Type the missing words first."; return; }
      if (!L.answers.map(norm).includes(guess)) {
        fb.className = "feedback bad"; fb.textContent = "Not quite. The signal's still fuzzy. Try again.";
        const f = document.getElementById("blForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
        return;
      }
      at++; focus(); dots();
      if (at < total) { fb.className = "feedback ok"; fb.textContent = "Signal improving."; return show(); }
      fb.className = "feedback ok"; fb.textContent = "Signal restored. Memory locked in.";
      document.getElementById("blCap").hidden = false;
      card.innerHTML = `<div class="row"><button class="btn" id="next" type="button">Continue</button></div>`;
      state.log.push(`> ${c.stamp} locked: soundtrack restored`); save(state);
      document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
    };
  }
  focus(); show();
}
