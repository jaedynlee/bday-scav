/* ---------- corn maze puzzle ---------- */
function mazeMarkup(c) {
  return `
    <div class="mz-stage" id="mzStage">
      <canvas id="mzCv" tabindex="0" aria-label="Corn maze at night. Swipe or use the arrow keys to move."></canvas>
      <figure class="nye-photo" id="mzPhoto" hidden><img src="${esc(c.photo)}" alt="${esc(c.photoAlt)}"><figcaption><span>Memory recovered</span>${esc(c.caption)}</figcaption></figure>
    </div>
    <div class="mz-pad" id="mzPad" aria-label="Move">
      <button type="button" data-d="up" aria-label="Up">▲</button>
      <button type="button" data-d="left" aria-label="Left">◀</button>
      <button type="button" data-d="down" aria-label="Down">▼</button>
      <button type="button" data-d="right" aria-label="Right">▶</button>
    </div>
    <div class="row" id="mzRow"></div>`;
}

function bindMaze(c) {
  const cv = document.getElementById("mzCv"), stage = document.getElementById("mzStage"), fb = document.getElementById("fb");
  const ctx = cv.getContext("2d"), n = c.size, G = 2 * n + 1;          // G×G tiles: odd tiles are cells, even are walls
  const open = new Uint8Array(G * G), at = (x, y) => y * G + x;
  // carve a perfect maze (one path between any two cells) with a randomized depth-first search
  // seeded random numbers, so the layout is the same every time
  let seed = (c.seed || 1) >>> 0;
  const rand = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const mid = (n - 1) >> 1;                                   // start in the middle of the field
  const seen = new Uint8Array(n * n), stack = [[mid, mid]]; seen[mid * n + mid] = 1; open[at(2 * mid + 1, 2 * mid + 1)] = 1;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy])
      .filter(([x, y]) => x >= 0 && y >= 0 && x < n && y < n && !seen[y * n + x]);
    if (!nb.length) { stack.pop(); continue; }
    const [x, y, dx, dy] = nb[Math.floor(rand() * nb.length)];
    seen[y * n + x] = 1; open[at(2 * cx + 1 + dx, 2 * cy + 1 + dy)] = 1; open[at(2 * x + 1, 2 * y + 1)] = 1;
    stack.push([x, y]);
  }
  const exit = { x: G - 2, y: G - 2 };
  const me = { x: 2 * mid + 1, y: 2 * mid + 1, fx: 2 * mid + 1, fy: 2 * mid + 1 };   // tile position and smoothed draw position
  let queue = [], done = false, steps = 0, size = 0, dpr = 1, last = performance.now();
  // corn stalk positions, fixed per wall tile so they don't shimmer
  const stalks = []; for (let i = 0; i < G * G; i++) if (!open[i]) for (let k = 0; k < 3; k++) stalks.push([i % G + rand(), ((i / G) | 0) + rand(), rand()]);

  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); size = stage.clientWidth; cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + "px"; };
  resize(); addEventListener("resize", resize);

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const canGo = (x, y) => x >= 0 && y >= 0 && x < G && y < G && open[at(x, y)];
  // a swipe runs until a wall, a side opening, or the exit
  function run(d) {
    if (done) return;
    const [dx, dy] = DIRS[d]; let x = me.x, y = me.y; queue = [];
    while (canGo(x + dx, y + dy)) {
      x += dx; y += dy; queue.push([x, y]);
      if (x === exit.x && y === exit.y) break;
      const side = dx ? canGo(x, y - 1) || canGo(x, y + 1) : canGo(x - 1, y) || canGo(x + 1, y);
      if (side && x % 2 && y % 2) break;
    }
    if (!queue.length) { fb.className = "feedback"; fb.textContent = "Corn that way. Try another direction."; }
  }

  function step(dt) {
    const sp = 14 * dt;
    me.fx += Math.sign(me.x - me.fx) * Math.min(sp, Math.abs(me.x - me.fx));
    me.fy += Math.sign(me.y - me.fy) * Math.min(sp, Math.abs(me.y - me.fy));
    if (me.fx === me.x && me.fy === me.y && queue.length) {
      [me.x, me.y] = queue.shift(); steps++;
      if (me.x === exit.x && me.y === exit.y) { queue = []; setTimeout(win, 350); done = true; }
    }
  }

  function draw(t) {
    const s = size * dpr / G; ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.fillStyle = "#3b2f1e"; ctx.fillRect(0, 0, G, G);                       // dirt path
    ctx.fillStyle = "#2e4a1f";
    for (let i = 0; i < G * G; i++) if (!open[i]) ctx.fillRect(i % G - .02, ((i / G) | 0) - .02, 1.04, 1.04);
    for (const [x, y, v] of stalks) {                                          // tassels and leaves
      ctx.fillStyle = v > .6 ? "#c9a64a" : v > .3 ? "#5f7a2c" : "#45622a";
      ctx.beginPath(); ctx.arc(x, y, .12 + v * .08, 0, Math.PI * 2); ctx.fill();
    }
    // lantern at the exit
    const fl = .85 + .15 * Math.sin(t / 120);
    const lg = ctx.createRadialGradient(exit.x + .5, exit.y + .5, 0, exit.x + .5, exit.y + .5, 1.6 * fl);
    lg.addColorStop(0, "rgba(255,190,90,.9)"); lg.addColorStop(1, "rgba(255,150,40,0)");
    ctx.fillStyle = lg; ctx.fillRect(exit.x - 1.5, exit.y - 1.5, 4, 4);
    ctx.fillStyle = "#ffd27a"; ctx.fillRect(exit.x + .35, exit.y + .3, .3, .4);
    // darkness with a flashlight hole around the player
    const px = me.fx + .5, py = me.fy + .5, r = done ? G : 2.8;
    ctx.save();
    const dark = ctx.createRadialGradient(px, py, r * .35, px, py, r);
    dark.addColorStop(0, "rgba(4,6,12,0)"); dark.addColorStop(1, "rgba(4,6,12,.94)");
    ctx.fillStyle = dark; ctx.fillRect(0, 0, G, G); ctx.restore();
    // the lantern shows through the dark
    const lg2 = ctx.createRadialGradient(exit.x + .5, exit.y + .5, 0, exit.x + .5, exit.y + .5, .9 * fl);
    lg2.addColorStop(0, "rgba(255,200,110,.95)"); lg2.addColorStop(1, "rgba(255,160,50,0)");
    ctx.fillStyle = lg2; ctx.fillRect(exit.x - .5, exit.y - .5, 2, 2);
    // him, from above: curly hair and glasses
    ctx.fillStyle = "#1b1612";
    for (let k = 0; k < 6; k++) { const an = k / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(px + Math.cos(an) * .15, py - .05 + Math.sin(an) * .1, .14, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#d29b74"; ctx.beginPath(); ctx.arc(px, py + .08, .2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#111"; ctx.lineWidth = .04; ctx.strokeRect(px - .17, py + .02, .14, .09); ctx.strokeRect(px + .03, py + .02, .14, .09);
  }

  function frame(t) {
    if (!document.body.contains(cv)) { removeEventListener("resize", resize); return; }
    step(Math.min(.05, (t - last) / 1000)); last = t; draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function win() {
    fb.className = "feedback ok"; fb.textContent = `Out of the maze in ${steps} steps. Memory recovered.`;
    const ph = document.getElementById("mzPhoto"); ph.hidden = false; requestAnimationFrame(() => ph.classList.add("show"));
    document.getElementById("mzPad").hidden = true;
    state.log.push(`> ${c.stamp} locked: escaped the corn maze`); save(state);
    document.getElementById("mzRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
    document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
  }

  // swipe on the maze
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); const sx = e.clientX, sy = e.clientY;
    const up = ev => {
      cv.removeEventListener("pointerup", up); cv.removeEventListener("pointercancel", up);
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      run(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  });
  document.getElementById("mzPad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) run(b.dataset.d); });
  cv.addEventListener("keydown", e => {
    const d = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (d) { e.preventDefault(); run(d); }
  });
}

/* ---------- campfire puzzle ---------- */
function campfireMarkup() {
  return `
    <div class="cf-stage" id="cfStage">
      <canvas id="cfCv" aria-label="A stone fire ring in a dark forest clearing"></canvas>
      <figure class="nye-photo" id="cfPhoto" hidden></figure>
    </div>
    <div class="cf-steps" id="cfSteps"><span class="on">1 Build</span><span>2 Spark</span><span>3 Blow</span></div>
    <div class="cf-ctrl" id="cfCtrl"></div>
    <div class="row" id="cfRow"></div>`;
}

function bindCampfire(c) {
  const cv = document.getElementById("cfCv"), stage = document.getElementById("cfStage"), ctrl = document.getElementById("cfCtrl"), fb = document.getElementById("fb");
  const ctx = cv.getContext("2d");
  let phase = "build", pile = [], heat = 0, flame = 0, inZone = 0, blowing = false, sparks = [], embers = [], size = 0, dpr = 1, last = performance.now();
  const ORDER = ["tinder", "kindling", "logs"], ZONE = [.45, .8], NEED = 3;
  const stars = Array.from({ length: 40 }, () => [Math.random(), Math.random() * .45, Math.random()]);
  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); size = stage.clientWidth; cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + "px"; };
  resize(); addEventListener("resize", resize);
  const say = (t, cls = "") => { fb.className = "feedback " + cls; fb.textContent = t; };
  const steps = n => [...document.querySelectorAll("#cfSteps span")].forEach((s, i) => s.className = i < n ? "done" : i === n ? "on" : "");

  function showBuild() {
    phase = "build"; pile = []; steps(0);
    const items = [...ORDER].sort(() => Math.random() - .5);
    ctrl.innerHTML = `<p class="map-note">Tap what goes on the fire, in order.</p>
      <div class="cf-items">${items.map(k => `<button type="button" class="btn ghost" data-k="${k}">${{ tinder: "Dry tinder", kindling: "Kindling sticks", logs: "Split logs" }[k]}</button>`).join("")}</div>`;
    ctrl.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      if (b.dataset.k !== ORDER[pile.length]) {
        say(pile.length === 0 && b.dataset.k === "logs" ? "Logs straight on the ground won't catch. Start small." :
            "Wrong order. That would smother it. Pile cleared, start again.", "bad");
        pile = []; ctrl.querySelectorAll("[data-k]").forEach(x => x.disabled = false); return;
      }
      pile.push(b.dataset.k); b.disabled = true; say(`${b.textContent} placed.`, "ok");
      if (pile.length === 3) setTimeout(showSpark, 500);
    });
  }

  function showSpark() {
    phase = "spark"; heat = 0; flame = 0; steps(1);
    ctrl.innerHTML = `<p class="map-note">Swipe back and forth fast across the rod to throw sparks.</p>
      <div class="cf-rod" id="cfRod"><i></i><span>Fire starter: swipe here</span></div>
      <div class="wok-meter"><span>Heat</span><div class="bar"><i id="cfHeat"></i></div><strong id="cfHeatPct">0%</strong></div>`;
    say("Throw sparks onto the tinder.");
    const rod = document.getElementById("cfRod"); let lx = null, dir = 0, run = 0;
    rod.addEventListener("pointerdown", e => { rod.setPointerCapture(e.pointerId); lx = e.clientX; run = 0; });
    rod.addEventListener("pointermove", e => {
      if (lx === null || phase !== "spark") return;
      const dx = e.clientX - lx, d = Math.sign(dx); lx = e.clientX;
      if (!d) return;
      run += Math.abs(dx);
      if (d !== dir) {                           // each stroke reversal throws sparks, scaled by stroke length
        if (run > 30) { heat = Math.min(1.05, heat + Math.min(.12, run / 1400)); for (let k = 0; k < 8; k++) sparks.push(spark()); }
        dir = d; run = 0;
      }
    });
    const end = () => { lx = null; };
    rod.addEventListener("pointerup", end); rod.addEventListener("pointercancel", end);
  }
  const spark = () => ({ x: .5 + (Math.random() - .5) * .08, y: .66, vx: (Math.random() - .5) * .5, vy: -Math.random() * .6 - .2, life: .6 + Math.random() * .4 });

  function showBlow() {
    phase = "blow"; flame = .2; inZone = 0; steps(2);
    ctrl.innerHTML = `<p class="map-note">Hold to blow. Keep the flame in the green band until the fire takes.</p>
      <div class="cf-gauge"><div class="cf-zone" style="left:${ZONE[0] * 100}%;width:${(ZONE[1] - ZONE[0]) * 100}%"></div><i id="cfFlame"></i></div>
      <div class="wok-meter"><span>Catching</span><div class="bar"><i id="cfCatch"></i></div><strong id="cfCatchPct">0%</strong></div>
      <button type="button" class="btn cf-blow" id="cfBlow">Hold to blow</button>`;
    say("The tinder's smoking. Blow gently.", "ok");
    const b = document.getElementById("cfBlow");
    const on = e => { e.preventDefault(); blowing = true; b.classList.add("held"); }, off = () => { blowing = false; b.classList.remove("held"); };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("pointerleave", off);
    b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") on(e); });
    b.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") off(); });
  }

  function step(dt) {
    sparks = sparks.filter(p => (p.life -= dt) > 0); sparks.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .9 * dt; });
    if (phase === "spark") {
      heat = Math.max(0, heat - .1 * dt);
      const hb = document.getElementById("cfHeat"); if (hb) { hb.style.width = Math.min(100, heat * 100) + "%"; document.getElementById("cfHeatPct").textContent = Math.min(100, Math.round(heat * 100)) + "%"; }
      if (heat >= 1) showBlow();
    } else if (phase === "blow") {
      flame += (blowing ? .55 : -.22) * dt;
      if (flame > 1) { blowing = false; say("Too hard! You blew it out. Strike a new spark.", "bad"); flame = 0; return showSpark(); }
      if (flame <= .02) { say("The ember died. Strike a new spark.", "bad"); flame = 0; return showSpark(); }
      if (flame >= ZONE[0] && flame <= ZONE[1]) inZone += dt;
      document.getElementById("cfFlame").style.left = (flame * 100).toFixed(1) + "%";
      const pct = Math.min(100, Math.round(inZone / NEED * 100));
      document.getElementById("cfCatch").style.width = pct + "%"; document.getElementById("cfCatchPct").textContent = pct + "%";
      if (inZone >= NEED) win();
    } else if (phase === "won") flame = Math.min(1.6, flame + .4 * dt);
    const f = phase === "blow" || phase === "won" ? flame : phase === "spark" ? heat * .15 : 0;
    if (f > .05 && Math.random() < f * 1.6) embers.push({ x: .5 + (Math.random() - .5) * .08 * (1 + f), y: .63, vy: -.15 - Math.random() * .2 * f, vx: (Math.random() - .5) * .05, life: 1 + Math.random() });
    embers = embers.filter(e => (e.life -= dt) > 0); embers.forEach(e => { e.x += e.vx * dt + Math.sin(e.life * 6) * .0008; e.y += e.vy * dt; });
  }

  function draw(t) {
    const s = size * dpr; ctx.setTransform(s, 0, 0, s, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, .7); sky.addColorStop(0, "#050816"); sky.addColorStop(1, "#14203a");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1, 1);
    stars.forEach(([x, y, v]) => { ctx.fillStyle = `rgba(255,255,255,${(.3 + .5 * Math.abs(Math.sin(t / 900 + v * 9))).toFixed(2)})`; ctx.fillRect(x, y, .004, .004); });
    ctx.fillStyle = "#070b14";                                                     // tree line
    for (let k = 0; k < 9; k++) { const x = k * .13 - .03, h = .22 + (k * 37 % 5) * .03; ctx.beginPath(); ctx.moveTo(x - .08, .62); ctx.lineTo(x, .62 - h); ctx.lineTo(x + .08, .62); ctx.fill(); }
    ctx.fillStyle = "#161a14"; ctx.fillRect(0, .6, 1, .4);                          // ground
    const f = phase === "blow" || phase === "won" ? flame : 0;
    if (f > 0) {                                                                    // firelight on the ground
      const gl = ctx.createRadialGradient(.5, .66, 0, .5, .66, .2 + .35 * f);
      gl.addColorStop(0, `rgba(255,150,60,${(.35 * Math.min(1, f)).toFixed(2)})`); gl.addColorStop(1, "rgba(255,120,40,0)");
      ctx.fillStyle = gl; ctx.fillRect(0, 0, 1, 1);
    }
    // stone ring
    for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2, x = .5 + Math.cos(an) * .17, y = .7 + Math.sin(an) * .055;
      ctx.fillStyle = k % 3 ? "#5b5f66" : "#6c7078"; ctx.beginPath(); ctx.ellipse(x, y, .035, .022, 0, 0, Math.PI * 2); ctx.fill(); }
    // the pile
    if (pile.includes("tinder")) { ctx.fillStyle = "#c9a85a"; for (let k = 0; k < 9; k++) { ctx.beginPath(); ctx.ellipse(.46 + k * .01, .69 - (k % 3) * .006, .022, .01, k * .4, 0, Math.PI * 2); ctx.fill(); } }
    ctx.lineCap = "round";
    if (pile.includes("kindling")) { ctx.strokeStyle = "#8a6a42"; ctx.lineWidth = .008; for (let k = 0; k < 7; k++) { const x = .42 + k * .027; ctx.beginPath(); ctx.moveTo(x, .705); ctx.lineTo(.5 + (x - .5) * .15, .6); ctx.stroke(); } }
    if (pile.includes("logs")) { ctx.strokeStyle = "#5a3b22"; ctx.lineWidth = .028; [[.36, .72], [.64, .72], [.43, .74], [.57, .74]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(.5 + (x - .5) * .2, .57); ctx.stroke(); }); }
    // flames
    if (f > .03) {
      for (let k = 0; k < 7; k++) {
        const off = (k - 3) * .022 * (1 + f * .5), h = (.08 + .2 * f) * (1 - Math.abs(k - 3) * .14) * (.85 + .15 * Math.sin(t / 80 + k * 2.3));
        const g = ctx.createLinearGradient(0, .69, 0, .69 - h);
        g.addColorStop(0, "rgba(255,240,170,.95)"); g.addColorStop(.4, "rgba(255,150,40,.85)"); g.addColorStop(1, "rgba(220,60,20,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(.5 + off - .03 * (1 + f * .4), .69);
        ctx.quadraticCurveTo(.5 + off - .02, .69 - h * .6, .5 + off + Math.sin(t / 120 + k) * .01, .69 - h);
        ctx.quadraticCurveTo(.5 + off + .02, .69 - h * .6, .5 + off + .03 * (1 + f * .4), .69); ctx.fill();
      }
    } else if (phase === "spark" && heat > .3) {                                    // smouldering tinder
      ctx.fillStyle = `rgba(255,110,40,${(heat * .6).toFixed(2)})`; ctx.beginPath(); ctx.arc(.5, .69, .015 + heat * .01, 0, Math.PI * 2); ctx.fill();
    }
    embers.forEach(e => { ctx.fillStyle = `rgba(255,${150 + (e.life * 50 | 0)},60,${Math.min(1, e.life).toFixed(2)})`; ctx.fillRect(e.x, e.y, .004, .004); });
    sparks.forEach(p => { ctx.fillStyle = `rgba(255,230,150,${p.life.toFixed(2)})`; ctx.fillRect(p.x, p.y, .005, .005); });
  }

  function frame(t) {
    if (!document.body.contains(cv)) { removeEventListener("resize", resize); return; }
    step(Math.min(.05, (t - last) / 1000)); last = t; draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function win() {
    phase = "won"; blowing = false; steps(3);
    ctrl.innerHTML = ""; say("The fire's roaring. Everyone gathers round.", "ok");
    setTimeout(() => {
      if (!document.body.contains(cv)) return;
      const ph = document.getElementById("cfPhoto");
      ph.innerHTML = `<img src="${esc(c.photo)}" alt="${esc(c.photoAlt)}"><figcaption><span>Memory recovered</span>${esc(c.caption)}</figcaption>`;
      ph.hidden = false; requestAnimationFrame(() => ph.classList.add("show"));
      state.log.push(`> ${c.stamp} locked: campfire lit`); save(state);
      document.getElementById("cfRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
      document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
    }, 2200);
  }
  showBuild();
}

/* ---------- chat puzzle ---------- */
function chatMarkup(c) {
  return `
    <div class="ch-phone">
      <div class="ch-head"><img src="${esc(c.photo)}" alt="" class="ch-avatar"><div><strong>${esc(c.contact)}</strong><span id="chStatus">online</span></div></div>
      <div class="ch-log" id="chLog" aria-live="polite">
        <div class="ch-msg them ch-photo"><img src="${esc(c.photo)}" alt="${esc(c.photoAlt)}"></div>
      </div>
      <form class="ch-input" id="chForm" autocomplete="off">
        <input id="chIn" aria-label="Message" placeholder="Message" maxlength="200">
        <button class="btn" type="submit" aria-label="Send">Send</button>
      </form>
    </div>
    <div class="row" id="chRow"></div>`;
}

function bindChat(c) {
  const log = document.getElementById("chLog"), form = document.getElementById("chForm"), input = document.getElementById("chIn");
  const status = document.getElementById("chStatus"), fb = document.getElementById("fb");
  let rounds = 0, waiting = false;
  const add = (cls, text) => {
    const m = document.createElement("div"); m.className = "ch-msg " + cls; m.textContent = text;
    log.appendChild(m); log.scrollTop = log.scrollHeight; return m;
  };
  form.onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || waiting) return;
    add("me", text); input.value = ""; waiting = true;
    setTimeout(() => {
      status.textContent = "typing…";
      const dots = add("them typing", "•••");
      setTimeout(() => {
        dots.remove(); status.textContent = "online";
        add("them", c.replies[Math.floor(Math.random() * c.replies.length)]);
        rounds++; waiting = false;
        if (rounds < c.rounds) return input.focus({ preventScroll: true });
        setTimeout(() => {
          if (c.endPhoto) {                                      // a last photo from Couch HQ before it signs off
            const m = document.createElement("div"); m.className = "ch-msg them ch-photo";
            m.innerHTML = `<img src="${esc(c.endPhoto)}" alt="${esc(c.endPhotoAlt || "")}">`;
            log.appendChild(m); m.querySelector("img").onload = () => { log.scrollTop = log.scrollHeight; };
          }
          add("system", c.ending); status.textContent = "asleep";
          input.disabled = true; form.querySelector("button").disabled = true;
          fb.className = "feedback ok"; fb.textContent = "Transmission complete. That's about as much as you'll get.";
          state.log.push(`> ${c.stamp} locked: nap negotiations concluded`); save(state);
          document.getElementById("chRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
          document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
        }, 900);
      }, 700 + Math.random() * 900);
    }, 400);
  };
}

/* ---------- photo jigsaw puzzle ---------- */
function jigsawMarkup(c) {
  const n = c.cols * c.rows; let order;
  do { order = [...Array(n).keys()].sort(() => Math.random() - .5); }
  while (order.filter((v, i) => v === i).length > 1);        // at most one tile starts in place
  return `
    <div class="jg-board" id="jgBoard" style="grid-template-columns:repeat(${c.cols},1fr);grid-template-rows:repeat(${c.rows},1fr);aspect-ratio:3/4">${order.map((p, i) => `
      <button type="button" class="jg-tile" data-p="${p}" aria-label="Tile ${i + 1}"
        style="background-image:url('${esc(c.photo)}');background-size:${c.cols * 100}% ${c.rows * 100}%;background-position:${(p % c.cols) / (c.cols - 1) * 100}% ${Math.floor(p / c.cols) / (c.rows - 1) * 100}%"></button>`).join("")}
      <figure class="jg-done" id="jgDone" hidden><img src="${esc(c.photo)}" alt="${esc(c.photoAlt)}"><figcaption><span>Memory recovered</span>${esc(c.caption)}</figcaption></figure>
    </div>
    <div class="mm-stats"><span>In place <strong id="jgPlaced">0/${c.cols * c.rows}</strong></span><span>Swaps <strong id="jgSwaps">0</strong></span></div>
    <div class="row" id="jgRow"></div>`;
}

function bindJigsaw(c) {
  const board = document.getElementById("jgBoard"), fb = document.getElementById("fb"), total = c.cols * c.rows;
  let sel = null, swaps = 0, done = false;
  const tiles = () => [...board.querySelectorAll(".jg-tile")];
  const check = () => {
    let placed = 0;
    tiles().forEach((t, i) => { const ok = +t.dataset.p === i; t.classList.toggle("ok", ok); t.disabled = done; placed += ok; });
    document.getElementById("jgPlaced").textContent = `${placed}/${total}`;
    if (placed === total && !done) {
      done = true; tiles().forEach(t => t.disabled = true);
      board.classList.add("solved");
      setTimeout(() => { const d = document.getElementById("jgDone"); d.hidden = false; requestAnimationFrame(() => d.classList.add("show")); }, 500);
      fb.className = "feedback ok"; fb.textContent = `Reassembled in ${swaps} swaps. Last memory recovered.`;
      state.log.push(`> ${c.stamp} locked: final fragment reassembled`); save(state);
      document.getElementById("jgRow").innerHTML = `<button class="btn" id="next" type="button">Continue</button>`;
      document.getElementById("next").onclick = () => { state.index++; state.index >= N ? (state.phase = "ready", save(state), renderReady()) : render(); };
    }
  };
  board.addEventListener("click", e => {
    const t = e.target.closest(".jg-tile"); if (!t || t.disabled) return;
    if (!sel) { sel = t; t.classList.add("sel"); return; }
    if (sel === t) { t.classList.remove("sel"); sel = null; return; }
    // swap the two tiles' picture pieces
    [sel.dataset.p, t.dataset.p] = [t.dataset.p, sel.dataset.p];
    [sel.style.backgroundPosition, t.style.backgroundPosition] = [t.style.backgroundPosition, sel.style.backgroundPosition];
    sel.classList.remove("sel"); sel = null; swaps++;
    document.getElementById("jgSwaps").textContent = swaps;
    fb.className = "feedback"; fb.textContent = "";
    check();
  });
  check();
}

const PUZZLES = {
  jigsaw: { markup: jigsawMarkup, bind: bindJigsaw },
  chat:     { markup: chatMarkup,     bind: bindChat },
  campfire: { markup: campfireMarkup, bind: bindCampfire },
  maze:   { markup: mazeMarkup,   bind: bindMaze },
  memory: { markup: memoryMarkup, bind: bindMemory },
  blanks: { markup: blanksMarkup, bind: bindBlanks },
  spot:   { markup: spotMarkup,   bind: bindSpot },
  volley: { markup: volleyMarkup, bind: bindVolley },
  wok:   { markup: wokMarkup,   bind: bindWok },
  where: { markup: whereMarkup, bind: bindWhere },
  faces: { markup: facesMarkup, bind: bindFaces },
  order: { markup: orderMarkup, bind: bindOrder },
  kiss:  { markup: kissMarkup,  bind: bindKiss },
};

function renderReady() {
  document.body.classList.add("ending");
  app.innerHTML = `
    <section class="endscreen">
      <div class="end-inner">
        <span class="end-eyebrow">All ${N} coordinates recovered</span>
        <h2 class="end-title">Return vector calculated</h2>
        <p class="end-status">The machine is stable enough for one last jump.</p>
        <button class="btn end-btn" id="home" type="button">${esc(HUNT.finale.button)}</button>
      </div>
    </section>`;
  document.getElementById("home").onclick = () => { state.phase = "done"; render(); };
}

function renderFinale() {
  const f = HUNT.finale;
  document.body.classList.add("ending");
  app.innerHTML = `
    <section class="endscreen finale" id="finale">
      <canvas class="end-fx" id="endFx" aria-hidden="true"></canvas>
      <div class="end-inner">
        <span class="end-eyebrow ok">Arrival confirmed · present day</span>
        <h2 class="end-title big">${esc(f.title)}</h2>
        <p class="end-status">${esc(f.status)}</p>
        <div class="end-meter">
          <span>${esc(f.integrity)}</span><div class="bar"><i id="endBar"></i></div><strong id="endPct">0%</strong>
        </div>
        ${f.body.map(p => `<p class="end-body">${esc(p)}</p>`).join("")}
        <p class="end-dest"><span>${esc(f.destinationLabel)}</span>${esc(f.destination)}</p>
        <p class="end-bday">${esc(f.birthday)}</p>
        <p class="end-signoff">${esc(f.signoff)}</p>
        <div class="row"><button class="linkish" id="reset" type="button">Restart mission</button></div>
      </div>
    </section>`;
  bindReset();
  // integrity meter fills to 100%, then fireworks
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = performance.now();
  (function fill(t) {
    const p = reduce ? 1 : Math.min(1, (t - t0) / 1600);
    const bar = document.getElementById("endBar"); if (!bar) return;
    bar.style.width = p * 100 + "%"; document.getElementById("endPct").textContent = Math.round(p * 100) + "%";
    if (p < 1) return requestAnimationFrame(fill);
    if (!reduce) fireworks(document.getElementById("endFx"), document.getElementById("finale"));
  })(t0);
}

function bindReset() {
  const r = document.getElementById("reset");
  if (!r) return;
  r.onclick = () => {
    if (r.dataset.armed) { state = { phase: "locked", index: 0, log: [] }; render(); return; }
    r.dataset.armed = "1"; r.textContent = "Click again to wipe progress and restart";
  };
}

if (state.phase === "ready") { renderReady(); } else { render(); }
</script>
